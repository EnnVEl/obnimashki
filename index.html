<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Обнимашки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #f7f0fa;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            padding: 8px;
            margin: 0;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            max-height: 780px;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s, background-image 0.3s;
            background-size: cover;
            background-position: center;
        }

        /* ----- header ----- */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 6px;
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        #counter {
            font-size: 24px;
            font-weight: 700;
            color: #2d1b3d;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.6);
            padding: 3px 14px;
            border-radius: 32px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #settings-btn {
            font-size: 26px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 28px;
            transition: 0.2s;
            color: #2d1b3d;
            -webkit-tap-highlight-color: transparent;
        }
        #settings-btn:hover {
            background: rgba(0,0,0,0.04);
        }

        /* ----- main button container ----- */
        #btn-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 16px;
            min-height: 0;
        }

        #hug-btn {
            aspect-ratio: 1/1;
            width: min(65%, 240px);
            max-width: 280px;
            border-radius: 50%;
            background: #ffb6c9;
            border: none;
            font-size: clamp(24px, 5vw, 38px);
            font-weight: 700;
            color: #4a2c5a;
            box-shadow: 0 10px 0 #d48a9e, 0 10px 20px rgba(0,0,0,0.15);
            transition: all 0.08s ease, background-color 0.2s, color 0.2s, background-image 0.3s, box-shadow 0.2s;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
            touch-action: manipulation;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            flex-shrink: 0;
        }
        #hug-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 0 #d48a9e, 0 8px 16px rgba(0,0,0,0.12);
        }
        #hug-btn .btn-text {
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: clamp(20px, 4vw, 32px);
        }
        #hug-btn.has-image .btn-text {
            opacity: 0.85;
        }
        #hug-btn:focus-visible {
            outline: none;
        }

        /* ----- bottom: calendar icon ----- */
        #bottom-bar {
            display: flex;
            justify-content: flex-start;
            padding: 6px 20px 14px;
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        #calendar-icon {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 32px;
            transition: 0.2s;
            color: #2d1b3d;
            -webkit-tap-highlight-color: transparent;
        }
        #calendar-icon:hover {
            background: rgba(0,0,0,0.04);
        }

        /* ----- overlay (settings / calendar) ----- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            border-radius: 36px;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            width: 92%;
            max-width: 340px;
            max-height: 82%;
            border-radius: 32px;
            padding: 20px 18px 18px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.25);
            overflow-y: auto;
            transition: transform 0.2s;
            transform: scale(0.95);
            color: #1f1a2b;
        }
        .overlay.open .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 20px;
            margin-bottom: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal h2 button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 6px;
            color: #4a3a5a;
        }

        .setting-group {
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0eaf5;
        }
        .setting-group:last-of-type {
            border-bottom: none;
            margin-bottom: 8px;
        }
        .setting-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 13px;
            color: #3a2a4a;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-picker-row input[type="color"] {
            width: 38px;
            height: 38px;
            border: 2px solid #ddd;
            border-radius: 24px;
            padding: 2px;
            background: white;
            cursor: pointer;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 24px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .btn-row button {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: #f0e6f5;
            color: #3d2a4a;
        }
        .btn-row button:active {
            background: #dcc8e5;
        }
        .btn-row button.primary {
            background: #c9b0d6;
            color: #1f0f2a;
        }
        .btn-row button.primary:active {
            background: #b094c2;
        }

        .file-upload-wrapper {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .file-upload-wrapper label {
            background: #eee8f0;
            padding: 6px 14px;
            border-radius: 24px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            color: #3d2a4a;
        }
        .file-upload-wrapper label:active {
            background: #dcc8e5;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-wrapper .remove-img {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #a080b0;
            padding: 2px 6px;
        }
        .file-upload-wrapper .edit-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #6a5a7a;
            padding: 2px 6px;
            transition: 0.2s;
        }
        .file-upload-wrapper .edit-btn:hover {
            transform: scale(1.1);
        }

        .btn-small {
            padding: 4px 12px;
            border-radius: 24px;
            border: none;
            background: #e8def0;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: #2d1b3d;
        }
        .btn-small:active {
            background: #d0c0dd;
        }

        /* Image editor */
        .image-editor {
            margin-top: 6px;
            padding: 10px;
            background: #f8f2fc;
            border-radius: 16px;
            display: none;
        }
        .image-editor.open {
            display: block;
        }
        .image-editor .slider-group {
            margin-bottom: 8px;
        }
        .image-editor .slider-group label {
            font-size: 12px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            color: #3a2a4a;
        }
        .image-editor input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #dcc8e5;
            border-radius: 8px;
            outline: none;
        }
        .image-editor input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #b094c2;
            cursor: pointer;
        }
        .image-editor .preview-container {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            background: #e8def0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-editor .preview-container img {
            position: absolute;
            object-fit: cover;
            transition: all 0.1s;
            max-width: none;
            max-height: none;
        }
        .image-editor .no-image {
            color: #887a98;
            font-size: 13px;
        }

        /* ----- calendar grid ----- */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 12px;
        }
        .calendar-nav button {
            background: #eee8f0;
            border: none;
            font-size: 18px;
            width: 34px;
            height: 34px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            color: #2d1b3d;
        }
        .calendar-nav span {
            font-weight: 600;
            font-size: 16px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: #5a4a6a;
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f0fa;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            color: #1f1a2b;
            position: relative;
        }
        .day-cell.empty {
            background: transparent;
            pointer-events: none;
        }
        .day-cell:active {
            background: #dcc8e5;
        }
        .day-cell .hug-indicator {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 10px;
            color: #c44a7a;
        }
        .day-cell.selected {
            background: #d4b0d9;
            color: #1e0f2a;
            font-weight: 600;
        }

        #day-info {
            margin-top: 12px;
            padding: 10px;
            background: #f3edf7;
            border-radius: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #2a1a3a;
        }

        /* scroll */
        .modal::-webkit-scrollbar {
            width: 3px;
        }
        .modal::-webkit-scrollbar-track {
            background: #ece4f0;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #b8a2c7;
            border-radius: 8px;
        }

        .reset-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 32px;
            background: #f0e6f5;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #3d2a4a;
        }
        .reset-btn:active {
            background: #dcc8e5;
        }

        /* Адаптация для маленьких экранов */
        @media (max-height: 700px) {
            #header {
                padding: 10px 16px 4px;
            }
            #counter {
                font-size: 20px;
                padding: 2px 12px;
            }
            #settings-btn {
                font-size: 22px;
            }
            #hug-btn {
                width: min(55%, 180px);
            }
            #hug-btn .btn-text {
                font-size: clamp(16px, 3.5vw, 26px);
            }
            #bottom-bar {
                padding: 4px 16px 10px;
            }
            #calendar-icon {
                font-size: 24px;
            }
            .modal {
                padding: 14px 14px 14px;
                max-height: 80%;
            }
            .modal h2 {
                font-size: 17px;
                margin-bottom: 10px;
            }
            .setting-group {
                margin-bottom: 10px;
                padding-bottom: 8px;
            }
            .setting-group label {
                font-size: 12px;
            }
        }

        @media (max-height: 600px) {
            #hug-btn {
                width: min(45%, 140px);
            }
            #hug-btn .btn-text {
                font-size: clamp(14px, 3vw, 20px);
            }
            #header {
                padding: 6px 12px 2px;
            }
            #counter {
                font-size: 16px;
                padding: 2px 10px;
            }
            #bottom-bar {
                padding: 2px 12px 6px;
            }
        }

        @media (max-width: 380px) {
            #app {
                border-radius: 24px;
            }
            .modal {
                width: 95%;
                padding: 12px 12px 12px;
            }
            .modal h2 {
                font-size: 16px;
            }
        }

        /* Модальное окно подтверждения */
        .confirm-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 36px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .confirm-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .confirm-box {
            background: #ffffff;
            padding: 24px 28px 20px;
            border-radius: 28px;
            max-width: 300px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.2s;
        }
        .confirm-overlay.open .confirm-box {
            transform: scale(1);
        }
        .confirm-box h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #2d1b3d;
        }
        .confirm-box p {
            font-size: 14px;
            color: #5a4a6a;
            margin-bottom: 18px;
        }
        .confirm-box .confirm-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .confirm-box .confirm-btns button {
            padding: 8px 28px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .confirm-box .confirm-btns .confirm-yes {
            background: #d48a9e;
            color: white;
        }
        .confirm-box .confirm-btns .confirm-yes:active {
            background: #c07a8e;
        }
        .confirm-box .confirm-btns .confirm-no {
            background: #f0e6f5;
            color: #3d2a4a;
        }
        .confirm-box .confirm-btns .confirm-no:active {
            background: #dcc8e5;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- header -->
    <div id="header">
        <span id="counter">🤗 0</span>
        <button id="settings-btn" aria-label="Настройки">⚙️</button>
    </div>

    <!-- главная кнопка -->
    <div id="btn-container">
        <button id="hug-btn">
            <span class="btn-text">обнимашки</span>
        </button>
    </div>

    <!-- нижняя панель -->
    <div id="bottom-bar">
        <button id="calendar-icon" aria-label="Календарь">📅</button>
    </div>

    <!-- overlay настроек -->
    <div id="settings-overlay" class="overlay">
        <div class="modal" id="settings-modal">
            <h2>
                Настройки
                <button id="close-settings">✕</button>
            </h2>
            
            <!-- Цвет фона приложения -->
            <div class="setting-group">
                <label>Цвет фона приложения</label>
                <div class="color-picker-row">
                    <input type="color" id="bg-color-picker" value="#f7f0fa">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-bg-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <!-- Фото на фон приложения -->
            <div class="setting-group">
                <label>Фото на фон приложения</label>
                <div class="file-upload-wrapper">
                    <label for="bg-image-upload">📁 Загрузить</label>
                    <input type="file" id="bg-image-upload" accept="image/*">
                    <button class="edit-btn" id="bg-image-edit" title="Редактировать">✏️</button>
                    <button class="remove-img" id="remove-bg-image" title="Удалить фото">✕</button>
                </div>
                <div class="image-editor" id="bg-image-editor">
                    <div class="preview-container" id="bg-image-preview">
                        <span class="no-image">Нет фото</span>
                    </div>
                    <div class="slider-group">
                        <label>Масштаб <span id="bg-image-scale-val">100%</span></label>
                        <input type="range" id="bg-image-scale" min="50" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Смещение X <span id="bg-image-x-val">0%</span></label>
                        <input type="range" id="bg-image-x" min="-50" max="50" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Смещение Y <span id="bg-image-y-val">0%</span></label>
                        <input type="range" id="bg-image-y" min="-50" max="50" value="0">
                    </div>
                </div>
            </div>

            <!-- Цвет фона под кнопкой -->
            <div class="setting-group">
                <label>Цвет фона под кнопкой</label>
                <div class="color-picker-row">
                    <input type="color" id="btn-bg-color-picker" value="#ffffff">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-btn-bg" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <!-- Фото на фон под кнопкой -->
            <div class="setting-group">
                <label>Фото на фон под кнопкой</label>
                <div class="file-upload-wrapper">
                    <label for="btn-bg-image-upload">📁 Загрузить</label>
                    <input type="file" id="btn-bg-image-upload" accept="image/*">
                    <button class="edit-btn" id="btn-bg-image-edit" title="Редактировать">✏️</button>
                    <button class="remove-img" id="remove-btn-bg-image" title="Удалить фото">✕</button>
                </div>
                <div class="image-editor" id="btn-bg-image-editor">
                    <div class="preview-container" id="btn-bg-preview">
                        <span class="no-image">Нет фото</span>
                    </div>
                    <div class="slider-group">
                        <label>Масштаб <span id="btn-bg-scale-val">100%</span></label>
                        <input type="range" id="btn-bg-scale" min="50" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Смещение X <span id="btn-bg-x-val">0%</span></label>
                        <input type="range" id="btn-bg-x" min="-50" max="50" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Смещение Y <span id="btn-bg-y-val">0%</span></label>
                        <input type="range" id="btn-bg-y" min="-50" max="50" value="0">
                    </div>
                </div>
            </div>

            <!-- Цвет самой кнопки -->
            <div class="setting-group">
                <label>Цвет самой кнопки</label>
                <div class="color-picker-row">
                    <input type="color" id="btn-color-picker" value="#ffb6c9">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-btn-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <!-- Цвет текста -->
            <div class="setting-group">
                <label>Цвет текста</label>
                <div class="color-picker-row">
                    <input type="color" id="text-color-picker" value="#2d1b3d">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-text-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <!-- Фото на кнопку -->
            <div class="setting-group">
                <label>Фото на кнопку</label>
                <div class="file-upload-wrapper">
                    <label for="btn-image-upload">📁 Загрузить</label>
                    <input type="file" id="btn-image-upload" accept="image/*">
                    <button class="edit-btn" id="btn-image-edit" title="Редактировать">✏️</button>
                    <button class="remove-img" id="remove-btn-image" title="Удалить фото">✕</button>
                </div>
                <div class="image-editor" id="btn-image-editor">
                    <div class="preview-container" id="btn-image-preview">
                        <span class="no-image">Нет фото</span>
                    </div>
                    <div class="slider-group">
                        <label>Масштаб <span id="btn-image-scale-val">100%</span></label>
                        <input type="range" id="btn-image-scale" min="50" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Смещение X <span id="btn-image-x-val">0%</span></label>
                        <input type="range" id="btn-image-x" min="-50" max="50" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Смещение Y <span id="btn-image-y-val">0%</span></label>
                        <input type="range" id="btn-image-y" min="-50" max="50" value="0">
                    </div>
                </div>
            </div>

            <!-- Сброс всех настроек -->
            <div class="setting-group" style="border-bottom: none; margin-bottom: 0;">
                <button class="reset-btn" id="reset-all-btn">Сбросить все настройки</button>
            </div>

            <!-- Кнопки сохранить/отмена -->
            <div class="btn-row" style="margin-top:12px; border-top:1px solid #f0eaf5; padding-top:12px;">
                <button id="save-settings" class="primary">Сохранить</button>
                <button id="cancel-settings">Отмена</button>
            </div>
        </div>
    </div>

    <!-- overlay календаря -->
    <div id="calendar-overlay" class="overlay">
        <div class="modal" id="calendar-modal">
            <h2>
                📅 Календарь
                <button id="close-calendar">✕</button>
            </h2>
            <div class="calendar-nav">
                <button id="prev-month">‹</button>
                <span id="month-year">Январь 2026</span>
                <button id="next-month">›</button>
            </div>
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="days-grid"></div>
            <div id="day-info">Выберите день</div>
        </div>
    </div>

    <!-- Модальное окно подтверждения сброса -->
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <h3>⚠️ Подтверждение</h3>
            <p>Вы уверены, что хотите сбросить все настройки и счётчик?</p>
            <div class="confirm-btns">
                <button class="confirm-yes" id="confirm-yes">Да, сбросить</button>
                <button class="confirm-no" id="confirm-no">Отмена</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---- состояние ----
        let hugCount = 0;
        let history = {};

        // настройки по умолчанию
        const defaultSettings = {
            bgColor: '#f7f0fa',
            textColor: '#2d1b3d',
            btnBgColor: '#ffffff',
            btnColor: '#ffb6c9',
            bgImage: null,
            btnBgImage: null,
            btnImage: null,
            bgImageSettings: { scale: 100, x: 0, y: 0 },
            btnBgImageSettings: { scale: 100, x: 0, y: 0 },
            btnImageSettings: { scale: 100, x: 0, y: 0 },
        };

        let settings = { ...defaultSettings };

        // временные
        let tempSettings = { ...settings };
        let tempBgImage = null;
        let tempBtnBgImage = null;
        let tempBtnImage = null;

        // календарь
        let currentYear = 2026;
        let currentMonth = 0;
        let selectedDate = null;

        // DOM
        const app = document.getElementById('app');
        const hugBtn = document.getElementById('hug-btn');
        const btnText = hugBtn.querySelector('.btn-text');
        const counterEl = document.getElementById('counter');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const closeSettings = document.getElementById('close-settings');
        const calendarOverlay = document.getElementById('calendar-overlay');
        const calendarIcon = document.getElementById('calendar-icon');
        const closeCalendar = document.getElementById('close-calendar');

        // пикеры
        const bgPicker = document.getElementById('bg-color-picker');
        const textPicker = document.getElementById('text-color-picker');
        const btnBgPicker = document.getElementById('btn-bg-color-picker');
        const btnColorPicker = document.getElementById('btn-color-picker');

        // кнопки сброса
        const resetBg = document.getElementById('reset-bg-color');
        const resetText = document.getElementById('reset-text-color');
        const resetBtnBg = document.getElementById('reset-btn-bg');
        const resetBtnColor = document.getElementById('reset-btn-color');

        // загрузка фото
        const bgImageUpload = document.getElementById('bg-image-upload');
        const btnBgImageUpload = document.getElementById('btn-bg-image-upload');
        const btnImageUpload = document.getElementById('btn-image-upload');
        const removeBgImage = document.getElementById('remove-bg-image');
        const removeBtnBgImage = document.getElementById('remove-btn-bg-image');
        const removeBtnImage = document.getElementById('remove-btn-image');

        // кнопки редактирования
        const bgImageEdit = document.getElementById('bg-image-edit');
        const btnBgImageEdit = document.getElementById('btn-bg-image-edit');
        const btnImageEdit = document.getElementById('btn-image-edit');

        // редакторы
        const bgImageEditor = document.getElementById('bg-image-editor');
        const btnBgImageEditor = document.getElementById('btn-bg-image-editor');
        const btnImageEditor = document.getElementById('btn-image-editor');

        // слайдеры для фона приложения
        const bgScale = document.getElementById('bg-image-scale');
        const bgX = document.getElementById('bg-image-x');
        const bgY = document.getElementById('bg-image-y');

        // слайдеры для фона под кнопкой
        const btnBgScale = document.getElementById('btn-bg-scale');
        const btnBgX = document.getElementById('btn-bg-x');
        const btnBgY = document.getElementById('btn-bg-y');

        // слайдеры для кнопки
        const btnImageScale = document.getElementById('btn-image-scale');
        const btnImageX = document.getElementById('btn-image-x');
        const btnImageY = document.getElementById('btn-image-y');

        const resetAllBtn = document.getElementById('reset-all-btn');
        const saveSettingsBtn = document.getElementById('save-settings');
        const cancelSettingsBtn = document.getElementById('cancel-settings');

        // Модальное окно подтверждения
        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmYes = document.getElementById('confirm-yes');
        const confirmNo = document.getElementById('confirm-no');

        const monthYearSpan = document.getElementById('month-year');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const daysGrid = document.getElementById('days-grid');
        const weekdaysEl = document.getElementById('weekdays');
        const dayInfo = document.getElementById('day-info');

        // ---- функции для работы с тенью ----
        function darkenColor(hex, percent) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            r = Math.max(0, r - (r * percent / 100));
            g = Math.max(0, g - (g * percent / 100));
            b = Math.max(0, b - (b * percent / 100));
            return `#${Math.round(r).toString(16).padStart(2,'0')}${Math.round(g).toString(16).padStart(2,'0')}${Math.round(b).toString(16).padStart(2,'0')}`;
        }

        function updateButtonShadow(color) {
            const dark = darkenColor(color, 35);
            hugBtn.style.boxShadow = `0 10px 0 ${dark}, 0 10px 20px rgba(0,0,0,0.15)`;
        }

        // ---- загрузка/сохранение ----
        function loadState() {
            try {
                const saved = localStorage.getItem('hugAppData');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.count !== undefined) hugCount = data.count;
                    if (data.history) history = data.history;
                    if (data.settings) {
                        settings = { ...defaultSettings, ...data.settings };
                    }
                    if (data.bgImage) settings.bgImage = data.bgImage;
                    if (data.btnBgImage) settings.btnBgImage = data.btnBgImage;
                    if (data.btnImage) settings.btnImage = data.btnImage;
                    if (data.bgImageSettings) settings.bgImageSettings = data.bgImageSettings;
                    if (data.btnBgImageSettings) settings.btnBgImageSettings = data.btnBgImageSettings;
                    if (data.btnImageSettings) settings.btnImageSettings = data.btnImageSettings;
                }
            } catch (e) {}
            tempSettings = { ...settings };
            tempBgImage = settings.bgImage;
            tempBtnBgImage = settings.btnBgImage;
            tempBtnImage = settings.btnImage;
            applyAllSettings();
            updateCounter();
        }

        function saveState() {
            try {
                localStorage.setItem('hugAppData', JSON.stringify({
                    count: hugCount,
                    history: history,
                    settings: settings,
                    bgImage: settings.bgImage,
                    btnBgImage: settings.btnBgImage,
                    btnImage: settings.btnImage,
                    bgImageSettings: settings.bgImageSettings,
                    btnBgImageSettings: settings.btnBgImageSettings,
                    btnImageSettings: settings.btnImageSettings,
                }));
            } catch (e) {}
        }

        // ---- применение настроек ----
        function applyAllSettings() {
            // Внешний фон
            document.body.style.backgroundColor = settings.bgColor;
            if (settings.bgImage) {
                const s = settings.bgImageSettings || { scale: 100, x: 0, y: 0 };
                document.body.style.backgroundImage = `url(${settings.bgImage})`;
                document.body.style.backgroundSize = `${s.scale}%`;
                document.body.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            // Внутренний фон (app)
            if (settings.btnBgImage) {
                const s = settings.btnBgImageSettings || { scale: 100, x: 0, y: 0 };
                app.style.backgroundImage = `url(${settings.btnBgImage})`;
                app.style.backgroundSize = `${s.scale}%`;
                app.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
                app.style.backgroundColor = 'transparent';
            } else {
                app.style.backgroundImage = 'none';
                app.style.backgroundColor = settings.btnBgColor;
            }

            // Цвет кнопки и тень
            hugBtn.style.backgroundColor = settings.btnColor;
            updateButtonShadow(settings.btnColor);

            // Цвет текста
            applyTextColor(settings.textColor);

            // Фото на кнопку
            if (settings.btnImage) {
                const s = settings.btnImageSettings || { scale: 100, x: 0, y: 0 };
                hugBtn.style.backgroundImage = `url(${settings.btnImage})`;
                hugBtn.style.backgroundSize = `${s.scale}%`;
                hugBtn.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
                hugBtn.classList.add('has-image');
            } else {
                hugBtn.style.backgroundImage = 'none';
                hugBtn.classList.remove('has-image');
            }

            updateCounter();
        }

        function applyTextColor(color) {
            const elements = document.querySelectorAll('#counter, #settings-btn, #calendar-icon, .modal, .modal *');
            elements.forEach(el => {
                if (el.tagName === 'INPUT' && el.type === 'color') return;
                if (el.closest('.modal') && !el.closest('.color-picker-row') && !el.closest('.file-upload-wrapper') && !el.closest('.image-editor')) {
                    el.style.color = color;
                }
            });
            document.querySelectorAll('.modal h2, .modal label, .modal span, .modal .day-cell, #day-info, .calendar-nav span, .weekdays div')
                .forEach(el => el.style.color = color);
            document.querySelectorAll('.reset-btn, .calendar-nav button, .modal h2 button, #settings-btn, #calendar-icon')
                .forEach(el => el.style.color = color);
            counterEl.style.color = color;
            hugBtn.style.color = color;
            btnText.style.color = color;
        }

        function updateCounter() {
            counterEl.innerHTML = `🤗 ${hugCount}`;
        }

        // ---- временные настройки ----
        function applyTempSettings() {
            const t = tempSettings;
            document.body.style.backgroundColor = t.bgColor;
            if (tempBgImage) {
                const s = t.bgImageSettings || { scale: 100, x: 0, y: 0 };
                document.body.style.backgroundImage = `url(${tempBgImage})`;
                document.body.style.backgroundSize = `${s.scale}%`;
                document.body.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            if (tempBtnBgImage) {
                const s = t.btnBgImageSettings || { scale: 100, x: 0, y: 0 };
                app.style.backgroundImage = `url(${tempBtnBgImage})`;
                app.style.backgroundSize = `${s.scale}%`;
                app.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
                app.style.backgroundColor = 'transparent';
            } else {
                app.style.backgroundImage = 'none';
                app.style.backgroundColor = t.btnBgColor;
            }

            hugBtn.style.backgroundColor = t.btnColor;
            updateButtonShadow(t.btnColor);

            const color = t.textColor;
            document.querySelectorAll('#counter, #settings-btn, #calendar-icon, .modal, .modal *').forEach(el => {
                if (el.tagName === 'INPUT' && el.type === 'color') return;
                if (el.closest('.modal') && !el.closest('.color-picker-row') && !el.closest('.file-upload-wrapper') && !el.closest('.image-editor')) {
                    el.style.color = color;
                }
            });
            document.querySelectorAll('.modal h2, .modal label, .modal span, .modal .day-cell, #day-info, .calendar-nav span, .weekdays div')
                .forEach(el => el.style.color = color);
            document.querySelectorAll('.reset-btn, .calendar-nav button, .modal h2 button, #settings-btn, #calendar-icon')
                .forEach(el => el.style.color = color);
            counterEl.style.color = color;
            hugBtn.style.color = color;
            btnText.style.color = color;

            if (tempBtnImage) {
                const s = t.btnImageSettings || { scale: 100, x: 0, y: 0 };
                hugBtn.style.backgroundImage = `url(${tempBtnImage})`;
                hugBtn.style.backgroundSize = `${s.scale}%`;
                hugBtn.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
                hugBtn.classList.add('has-image');
            } else {
                hugBtn.style.backgroundImage = 'none';
                hugBtn.classList.remove('has-image');
            }
        }

        // ---- отображение редактора ----
        function toggleEditor(editorId, imageData) {
            const editor = document.getElementById(editorId);
            const isOpen = editor.classList.contains('open');
            
            if (imageData) {
                if (isOpen) {
                    editor.classList.remove('open');
                } else {
                    editor.classList.add('open');
                    updateEditorPreview(editorId, imageData);
                }
            } else {
                editor.classList.remove('open');
            }
        }

        function updateEditorPreview(editorId, imageData) {
            const editor = document.getElementById(editorId);
            const preview = editor.querySelector('.preview-container');
            const noImage = preview.querySelector('.no-image');
            let img = preview.querySelector('img');
            
            if (imageData) {
                if (!img) {
                    img = document.createElement('img');
                    preview.appendChild(img);
                }
                img.src = imageData;
                img.style.display = 'block';
                if (noImage) noImage.style.display = 'none';
                
                let scale = 100, x = 0, y = 0;
                if (editorId === 'bg-image-editor') {
                    const s = tempSettings.bgImageSettings || { scale: 100, x: 0, y: 0 };
                    scale = s.scale; x = s.x; y = s.y;
                } else if (editorId === 'btn-bg-image-editor') {
                    const s = tempSettings.btnBgImageSettings || { scale: 100, x: 0, y: 0 };
                    scale = s.scale; x = s.x; y = s.y;
                } else if (editorId === 'btn-image-editor') {
                    const s = tempSettings.btnImageSettings || { scale: 100, x: 0, y: 0 };
                    scale = s.scale; x = s.x; y = s.y;
                }
                img.style.width = `${scale}%`;
                img.style.height = `${scale}%`;
                img.style.transform = `translate(${x}%, ${y}%)`;
            } else {
                if (img) img.style.display = 'none';
                if (noImage) noImage.style.display = 'block';
            }
        }

        // ---- открытие настроек ----
        function openSettings() {
            tempSettings = { ...settings };
            tempBgImage = settings.bgImage;
            tempBtnBgImage = settings.btnBgImage;
            tempBtnImage = settings.btnImage;
            bgPicker.value = tempSettings.bgColor;
            textPicker.value = tempSettings.textColor;
            btnBgPicker.value = tempSettings.btnBgColor;
            btnColorPicker.value = tempSettings.btnColor;
            
            document.querySelectorAll('.image-editor').forEach(el => el.classList.remove('open'));
            
            applyTempSettings();
            settingsOverlay.classList.add('open');
        }

        function closeSettingsFn(apply) {
            settingsOverlay.classList.remove('open');
            if (apply) {
                settings = { ...tempSettings };
                settings.bgImage = tempBgImage;
                settings.btnBgImage = tempBtnBgImage;
                settings.btnImage = tempBtnImage;
                applyAllSettings();
                saveState();
            } else {
                applyAllSettings();
            }
        }

        // ---- календарь ----
        function renderCalendar(year, month) {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            monthYearSpan.textContent = monthNames[month] + ' ' + year;

            const shortDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            weekdaysEl.innerHTML = shortDays.map(d => `<div>${d}</div>`).join('');

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const daysInMonth = new Date(year, month+1, 0).getDate();

            let gridHtml = '';
            for (let i = 0; i < startDay; i++) {
                gridHtml += `<div class="day-cell empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
                const count = history[key] || 0;
                const isSelected = (selectedDate === key);
                let classes = 'day-cell';
                if (isSelected) classes += ' selected';
                let indicator = count > 0 ? `<span class="hug-indicator">❤️${count}</span>` : '';
                gridHtml += `<div class="${classes}" data-date="${key}">${d}${indicator}</div>`;
            }

            daysGrid.innerHTML = gridHtml;

            document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
                cell.addEventListener('click', function() {
                    const dateKey = this.dataset.date;
                    if (dateKey) {
                        selectedDate = dateKey;
                        renderCalendar(currentYear, currentMonth);
                        showDayInfo(dateKey);
                    }
                });
            });

            if (selectedDate) {
                const [y,m] = selectedDate.split('-').map(Number);
                if (y === year && m-1 === month) {
                    showDayInfo(selectedDate);
                } else {
                    dayInfo.textContent = 'Выберите день';
                }
            } else {
                dayInfo.textContent = 'Выберите день';
            }
        }

        function showDayInfo(dateKey) {
            const count = history[dateKey] || 0;
            const parts = dateKey.split('-');
            const d = new Date(parts[0], parts[1]-1, parts[2]);
            const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            const wd = weekdays[d.getDay() === 0 ? 6 : d.getDay()-1];
            const dateStr = `${d.getDate()} ${['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`;
            dayInfo.textContent = `${dateStr} (${wd}) — ${count} обнимашек`;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentYear < 2026) { currentYear = 2026; currentMonth = 0; }
            renderCalendar(currentYear, currentMonth);
        }

        function openCalendar() {
            calendarOverlay.classList.add('open');
            if (!selectedDate) {
                const today = new Date();
                const key = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
                selectedDate = key;
            }
            if (selectedDate) {
                const [y,m] = selectedDate.split('-').map(Number);
                currentYear = y;
                currentMonth = m-1;
            } else {
                currentYear = 2026;
                currentMonth = 0;
            }
            renderCalendar(currentYear, currentMonth);
        }

        // ---- обработчики ----
        hugBtn.addEventListener('click', function() {
            hugCount++;
            const today = new Date();
            const key = today.getFullYear() + '-' + 
                        String(today.getMonth()+1).padStart(2,'0') + '-' + 
                        String(today.getDate()).padStart(2,'0');
            history[key] = (history[key] || 0) + 1;
            updateCounter();
            saveState();
            if (calendarOverlay.classList.contains('open') && selectedDate === key) {
                showDayInfo(key);
            }
            if (calendarOverlay.classList.contains('open')) {
                renderCalendar(currentYear, currentMonth);
            }
        });

        settingsBtn.addEventListener('click', openSettings);
        closeSettings.addEventListener('click', () => closeSettingsFn(false));
        cancelSettingsBtn.addEventListener('click', () => closeSettingsFn(false));
        saveSettingsBtn.addEventListener('click', () => closeSettingsFn(true));

        settingsOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeSettingsFn(false);
        });

        // пикеры
        bgPicker.addEventListener('input', function() {
            tempSettings.bgColor = this.value;
            applyTempSettings();
        });
        textPicker.addEventListener('input', function() {
            tempSettings.textColor = this.value;
            applyTempSettings();
        });
        btnBgPicker.addEventListener('input', function() {
            tempSettings.btnBgColor = this.value;
            applyTempSettings();
        });
        btnColorPicker.addEventListener('input', function() {
            tempSettings.btnColor = this.value;
            applyTempSettings();
        });

        // сброс цвета
        resetBg.addEventListener('click', () => {
            tempSettings.bgColor = '#f7f0fa';
            bgPicker.value = '#f7f0fa';
            applyTempSettings();
        });
        resetText.addEventListener('click', () => {
            tempSettings.textColor = '#2d1b3d';
            textPicker.value = '#2d1b3d';
            applyTempSettings();
        });
        resetBtnBg.addEventListener('click', () => {
            tempSettings.btnBgColor = '#ffffff';
            btnBgPicker.value = '#ffffff';
            applyTempSettings();
        });
        resetBtnColor.addEventListener('click', () => {
            tempSettings.btnColor = '#ffb6c9';
            btnColorPicker.value = '#ffb6c9';
            applyTempSettings();
        });

        // загрузка фото
        bgImageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    tempBgImage = ev.target.result;
                    if (!tempSettings.bgImageSettings) {
                        tempSettings.bgImageSettings = { scale: 100, x: 0, y: 0 };
                    }
                    applyTempSettings();
                };
                reader.readAsDataURL(file);
            }
        });

        btnBgImageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    tempBtnBgImage = ev.target.result;
                    if (!tempSettings.btnBgImageSettings) {
                        tempSettings.btnBgImageSettings = { scale: 100, x: 0, y: 0 };
                    }
                    applyTempSettings();
                };
                reader.readAsDataURL(file);
            }
        });

        btnImageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    tempBtnImage = ev.target.result;
                    if (!tempSettings.btnImageSettings) {
                        tempSettings.btnImageSettings = { scale: 100, x: 0, y: 0 };
                    }
                    applyTempSettings();
                };
                reader.readAsDataURL(file);
            }
        });

        // удаление фото
        removeBgImage.addEventListener('click', function() {
            tempBgImage = null;
            bgImageUpload.value = '';
            document.getElementById('bg-image-editor').classList.remove('open');
            applyTempSettings();
        });
        removeBtnBgImage.addEventListener('click', function() {
            tempBtnBgImage = null;
            btnBgImageUpload.value = '';
            document.getElementById('btn-bg-image-editor').classList.remove('open');
            applyTempSettings();
        });
        removeBtnImage.addEventListener('click', function() {
            tempBtnImage = null;
            btnImageUpload.value = '';
            document.getElementById('btn-image-editor').classList.remove('open');
            applyTempSettings();
        });

        // кнопки редактирования
        bgImageEdit.addEventListener('click', function() {
            if (tempBgImage) {
                toggleEditor('bg-image-editor', tempBgImage);
            }
        });
        btnBgImageEdit.addEventListener('click', function() {
            if (tempBtnBgImage) {
                toggleEditor('btn-bg-image-editor', tempBtnBgImage);
            }
        });
        btnImageEdit.addEventListener('click', function() {
            if (tempBtnImage) {
                toggleEditor('btn-image-editor', tempBtnImage);
            }
        });

        // настройка слайдеров
        function setupSlider(sliderId, valId, editorId, settingsKey) {
            const slider = document.getElementById(sliderId);
            const valSpan = document.getElementById(valId);
            slider.addEventListener('input', function() {
                const val = parseInt(this.value);
                valSpan.textContent = val + '%';
                if (!tempSettings[settingsKey]) {
                    tempSettings[settingsKey] = { scale: 100, x: 0, y: 0 };
                }
                const key = sliderId.includes('scale') ? 'scale' : sliderId.includes('x') ? 'x' : 'y';
                tempSettings[settingsKey][key] = val;
                let imageData = null;
                if (settingsKey === 'bgImageSettings') imageData = tempBgImage;
                else if (settingsKey === 'btnBgImageSettings') imageData = tempBtnBgImage;
                else if (settingsKey === 'btnImageSettings') imageData = tempBtnImage;
                if (imageData) {
                    updateEditorPreview(editorId, imageData);
                }
                applyTempSettings();
            });
        }

        setupSlider('bg-image-scale', 'bg-image-scale-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('bg-image-x', 'bg-image-x-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('bg-image-y', 'bg-image-y-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('btn-bg-scale', 'btn-bg-scale-val', 'btn-bg-image-editor', 'btnBgImageSettings');
        setupSlider('btn-bg-x', 'btn-bg-x-val', 'btn-bg-image-editor', 'btnBgImageSettings');
        setupSlider('btn-bg-y', 'btn-bg-y-val', 'btn-bg-image-editor', 'btnBgImageSettings');
        setupSlider('btn-image-scale', 'btn-image-scale-val', 'btn-image-editor', 'btnImageSettings');
        setupSlider('btn-image-x', 'btn-image-x-val', 'btn-image-editor', 'btnImageSettings');
        setupSlider('btn-image-y', 'btn-image-y-val', 'btn-image-editor', 'btnImageSettings');

        // ---- Сброс всех настроек с подтверждением ----
        resetAllBtn.addEventListener('click', function() {
            confirmOverlay.classList.add('open');
        });

        confirmYes.addEventListener('click', function() {
            // Сброс счётчика
            hugCount = 0;
            history = {};
            updateCounter();
            
            // Сброс настроек
            settings = { ...defaultSettings };
            tempSettings = { ...defaultSettings };
            tempBgImage = null;
            tempBtnBgImage = null;
            tempBtnImage = null;
            
            // Закрыть все редакторы
            document.querySelectorAll('.image-editor').forEach(el => el.classList.remove('open'));
            
            // Обновить пикеры
            bgPicker.value = defaultSettings.bgColor;
            textPicker.value = defaultSettings.textColor;
            btnBgPicker.value = defaultSettings.btnBgColor;
            btnColorPicker.value = defaultSettings.btnColor;
            
            // Очистить загрузчики
            bgImageUpload.value = '';
            btnBgImageUpload.value = '';
            btnImageUpload.value = '';
            
            // Применить настройки
            applyAllSettings();
            saveState();
            
            // Обновить календарь если открыт
            if (calendarOverlay.classList.contains('open')) {
                renderCalendar(currentYear, currentMonth);
            }
            selectedDate = null;
            dayInfo.textContent = 'Выберите день';
            
            confirmOverlay.classList.remove('open');
        });

        confirmNo.addEventListener('click', function() {
            confirmOverlay.classList.remove('open');
        });

        confirmOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                confirmOverlay.classList.remove('open');
            }
        });

        calendarIcon.addEventListener('click', openCalendar);
        closeCalendar.addEventListener('click', () => {
            calendarOverlay.classList.remove('open');
        });
        calendarOverlay.addEventListener('click', function(e) {
            if (e.target === this) calendarOverlay.classList.remove('open');
        });
        prevMonthBtn.addEventListener('click', () => changeMonth(-1));
        nextMonthBtn.addEventListener('click', () => changeMonth(1));

        // ---- инициализация ----
        loadState();

        const today = new Date();
        const defaultKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        selectedDate = defaultKey;

        applyAllSettings();
    })();
</script>
</body>
</html>
