<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Обнимашки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f7f0fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            padding: 12px;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 780px;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        /* ----- header ----- */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 8px;
            position: relative;
            z-index: 5;
        }

        #counter {
            font-size: 28px;
            font-weight: 700;
            color: #2d1b3d;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.6);
            padding: 4px 18px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: color 0.2s;
        }

        #settings-btn {
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            transition: 0.2s;
            color: #2d1b3d;
        }
        #settings-btn:hover {
            background: rgba(0,0,0,0.04);
        }

        /* ----- main button ----- */
        #hug-btn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 24px 20px;
            background: #ffb6c9;
            border: none;
            border-radius: 100px;
            font-size: 48px;
            font-weight: 700;
            color: #4a2c5a;
            box-shadow: 0 12px 0 #d48a9e, 0 12px 24px rgba(0,0,0,0.15);
            transition: all 0.08s ease;
            cursor: pointer;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
            touch-action: manipulation;
            transition: background-color 0.2s, color 0.2s;
        }
        #hug-btn:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #d48a9e, 0 10px 20px rgba(0,0,0,0.12);
        }

        /* ----- bottom: calendar icon ----- */
        #bottom-bar {
            display: flex;
            justify-content: flex-start;
            padding: 8px 24px 20px;
            position: relative;
            z-index: 5;
        }

        #calendar-icon {
            background: none;
            border: none;
            font-size: 34px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 40px;
            transition: 0.2s;
            color: #2d1b3d;
        }
        #calendar-icon:hover {
            background: rgba(0,0,0,0.04);
        }

        /* ----- overlay (settings / calendar) ----- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            border-radius: 40px;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            width: 90%;
            max-width: 360px;
            max-height: 85%;
            border-radius: 40px;
            padding: 28px 24px 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            overflow-y: auto;
            transition: transform 0.2s;
            transform: scale(0.95);
            color: #1f1a2b;
        }
        .overlay.open .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal h2 button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
            color: #4a3a5a;
        }

        .setting-group {
            margin-bottom: 24px;
        }
        .setting-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 15px;
            color: #3a2a4a;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .color-picker-row input[type="color"] {
            width: 48px;
            height: 48px;
            border: 2px solid #ddd;
            border-radius: 30px;
            padding: 2px;
            background: white;
            cursor: pointer;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 30px;
        }

        .reset-btn {
            background: #f0e6f5;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            color: #3d2a4a;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 8px;
        }
        .reset-btn:active {
            background: #dcc8e5;
        }

        /* ----- calendar grid ----- */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 16px;
        }
        .calendar-nav button {
            background: #eee8f0;
            border: none;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            color: #2d1b3d;
        }
        .calendar-nav span {
            font-weight: 600;
            font-size: 18px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #5a4a6a;
            margin-bottom: 6px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .day-cell {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f0fa;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            color: #1f1a2b;
            position: relative;
        }
        .day-cell.empty {
            background: transparent;
            pointer-events: none;
        }
        .day-cell:active {
            background: #dcc8e5;
        }
        .day-cell .hug-indicator {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 12px;
            color: #c44a7a;
        }
        .day-cell.selected {
            background: #d4b0d9;
            color: #1e0f2a;
            font-weight: 600;
        }

        #day-info {
            margin-top: 16px;
            padding: 12px;
            background: #f3edf7;
            border-radius: 30px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: #2a1a3a;
        }

        /* scroll */
        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal::-webkit-scrollbar-track {
            background: #ece4f0;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #b8a2c7;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- header -->
    <div id="header">
        <span id="counter">0</span>
        <button id="settings-btn" aria-label="Настройки">⚙️</button>
    </div>

    <!-- главная кнопка -->
    <button id="hug-btn">обнимашки</button>

    <!-- нижняя панель -->
    <div id="bottom-bar">
        <button id="calendar-icon" aria-label="Календарь">📅</button>
    </div>

    <!-- overlay настроек -->
    <div id="settings-overlay" class="overlay">
        <div class="modal" id="settings-modal">
            <h2>
                Настройки
                <button id="close-settings">✕</button>
            </h2>
            <div class="setting-group">
                <label>Цвет фона</label>
                <div class="color-picker-row">
                    <input type="color" id="bg-color-picker" value="#f7f0fa">
                    <span style="font-size:14px; color:#5a4a6a;">выберите цвет</span>
                </div>
            </div>
            <div class="setting-group">
                <label>Цвет текста</label>
                <div class="color-picker-row">
                    <input type="color" id="text-color-picker" value="#2d1b3d">
                    <span style="font-size:14px; color:#5a4a6a;">весь текст</span>
                </div>
            </div>
            <button class="reset-btn" id="reset-counter-btn">Сбросить счётчик</button>
        </div>
    </div>

    <!-- overlay календаря -->
    <div id="calendar-overlay" class="overlay">
        <div class="modal" id="calendar-modal">
            <h2>
                📅 Календарь
                <button id="close-calendar">✕</button>
            </h2>
            <div class="calendar-nav">
                <button id="prev-month">‹</button>
                <span id="month-year">Январь 2026</span>
                <button id="next-month">›</button>
            </div>
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="days-grid"></div>
            <div id="day-info">Выберите день</div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---- состояние ----
        let hugCount = 0;
        // сохраняем историю: ключ "YYYY-MM-DD" -> количество
        let history = {};

        // текущие цвета
        let bgColor = '#f7f0fa';
        let textColor = '#2d1b3d';

        // календарь
        let currentYear = 2026;
        let currentMonth = 0; // 0-11
        let selectedDate = null; // 'YYYY-MM-DD'

        // DOM
        const counterEl = document.getElementById('counter');
        const hugBtn = document.getElementById('hug-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const closeSettings = document.getElementById('close-settings');
        const calendarOverlay = document.getElementById('calendar-overlay');
        const calendarIcon = document.getElementById('calendar-icon');
        const closeCalendar = document.getElementById('close-calendar');

        const bgPicker = document.getElementById('bg-color-picker');
        const textPicker = document.getElementById('text-color-picker');
        const resetBtn = document.getElementById('reset-counter-btn');

        const monthYearSpan = document.getElementById('month-year');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const daysGrid = document.getElementById('days-grid');
        const weekdaysEl = document.getElementById('weekdays');
        const dayInfo = document.getElementById('day-info');

        const app = document.getElementById('app');

        // ---- инициализация истории из localStorage ----
        function loadState() {
            try {
                const saved = localStorage.getItem('hugAppData');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.count !== undefined) hugCount = data.count;
                    if (data.history) history = data.history;
                    if (data.bgColor) bgColor = data.bgColor;
                    if (data.textColor) textColor = data.textColor;
                }
            } catch (e) {}
            applyColors();
            updateCounter();
        }

        function saveState() {
            try {
                localStorage.setItem('hugAppData', JSON.stringify({
                    count: hugCount,
                    history: history,
                    bgColor: bgColor,
                    textColor: textColor
                }));
            } catch (e) {}
        }

        // ---- apply colors ----
        function applyColors() {
            document.body.style.backgroundColor = bgColor;
            app.style.backgroundColor = '#ffffff'; // сохраняем белый фон карточки
            // все текстовые элементы
            const textElements = document.querySelectorAll('#counter, #settings-btn, #calendar-icon, #hug-btn, .modal, .modal *');
            textElements.forEach(el => {
                if (el.tagName === 'INPUT' && el.type === 'color') return;
                if (el.closest('.modal') && !el.closest('.color-picker-row')) {
                    // в модалках тоже меняем, но оставляем инпуты
                }
                el.style.color = textColor;
            });
            // отдельно для кнопки обнимашки (чтобы перебить)
            hugBtn.style.color = textColor;
            // заголовок и остальное в модалке
            document.querySelectorAll('.modal h2, .modal label, .modal span, .modal .day-cell, #day-info, .calendar-nav span, .weekdays div')
                .forEach(el => el.style.color = textColor);
            // специально для инпутов цвет не трогаем
            // но цвет текста в picker не меняем
            // также для кнопок
            document.querySelectorAll('.reset-btn, .calendar-nav button, .modal h2 button, #settings-btn, #calendar-icon')
                .forEach(el => el.style.color = textColor);
        }

        // обновить счетчик
        function updateCounter() {
            counterEl.textContent = hugCount;
        }

        // ---- обработка нажатия обнимашек ----
        function handleHug() {
            hugCount++;
            const today = new Date();
            const key = today.getFullYear() + '-' + 
                        String(today.getMonth()+1).padStart(2,'0') + '-' + 
                        String(today.getDate()).padStart(2,'0');
            history[key] = (history[key] || 0) + 1;
            updateCounter();
            saveState();
            // если календарь открыт и выбран сегодня — обновить информацию
            if (calendarOverlay.classList.contains('open') && selectedDate === key) {
                showDayInfo(key);
            }
            // также обновить сетку если открыт календарь (чтобы индикаторы обновились)
            if (calendarOverlay.classList.contains('open')) {
                renderCalendar(currentYear, currentMonth);
            }
        }

        // ---- календарь ----
        function renderCalendar(year, month) {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            monthYearSpan.textContent = monthNames[month] + ' ' + year;

            // заголовки дней недели (по 2 буквы)
            const shortDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            weekdaysEl.innerHTML = shortDays.map(d => `<div>${d}</div>`).join('');

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; // Пн=0
            const daysInMonth = new Date(year, month+1, 0).getDate();

            let gridHtml = '';
            // пустые ячейки
            for (let i = 0; i < startDay; i++) {
                gridHtml += `<div class="day-cell empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(year, month, d);
                const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
                const count = history[key] || 0;
                const isSelected = (selectedDate === key);
                let classes = 'day-cell';
                if (isSelected) classes += ' selected';
                let indicator = count > 0 ? `<span class="hug-indicator">❤️${count}</span>` : '';
                gridHtml += `<div class="${classes}" data-date="${key}">${d}${indicator}</div>`;
            }

            daysGrid.innerHTML = gridHtml;

            // добавить обработчики на ячейки
            document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
                cell.addEventListener('click', function(e) {
                    const dateKey = this.dataset.date;
                    if (dateKey) {
                        selectedDate = dateKey;
                        renderCalendar(currentYear, currentMonth);
                        showDayInfo(dateKey);
                    }
                });
            });

            // если есть выбранная дата, показать инфо
            if (selectedDate) {
                const [y,m,d] = selectedDate.split('-').map(Number);
                if (y === year && m-1 === month) {
                    showDayInfo(selectedDate);
                } else {
                    // выбранная дата не в этом месяце
                    dayInfo.textContent = 'Выберите день';
                }
            } else {
                dayInfo.textContent = 'Выберите день';
            }
        }

        function showDayInfo(dateKey) {
            const count = history[dateKey] || 0;
            const parts = dateKey.split('-');
            const d = new Date(parts[0], parts[1]-1, parts[2]);
            const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            const wd = weekdays[d.getDay() === 0 ? 6 : d.getDay()-1];
            const dateStr = `${d.getDate()} ${['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`;
            dayInfo.textContent = `${dateStr} (${wd}) — ${count} обнимашек`;
        }

        // переключение месяца
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentYear < 2026) { currentYear = 2026; currentMonth = 0; }
            renderCalendar(currentYear, currentMonth);
        }

        // ---- overlay logic ----
        function openSettings() {
            settingsOverlay.classList.add('open');
            // установить текущие цвета в пикеры
            bgPicker.value = bgColor;
            textPicker.value = textColor;
        }

        function closeSettingsFn() {
            settingsOverlay.classList.remove('open');
        }

        function openCalendar() {
            calendarOverlay.classList.add('open');
            // если нет selected, поставим сегодня
            if (!selectedDate) {
                const today = new Date();
                const key = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
                selectedDate = key;
            }
            // перейти к году/месяцу выбранной даты
            if (selectedDate) {
                const [y,m] = selectedDate.split('-').map(Number);
                currentYear = y;
                currentMonth = m-1;
            } else {
                currentYear = 2026;
                currentMonth = 0;
            }
            renderCalendar(currentYear, currentMonth);
        }

        function closeCalendarFn() {
            calendarOverlay.classList.remove('open');
        }

        // ---- события ----
        hugBtn.addEventListener('click', handleHug);

        settingsBtn.addEventListener('click', openSettings);
        closeSettings.addEventListener('click', closeSettingsFn);
        settingsOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeSettingsFn();
        });

        calendarIcon.addEventListener('click', openCalendar);
        closeCalendar.addEventListener('click', closeCalendarFn);
        calendarOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeCalendarFn();
        });

        // настройки цвета
        bgPicker.addEventListener('input', function(e) {
            bgColor = this.value;
            document.body.style.backgroundColor = bgColor;
            saveState();
        });

        textPicker.addEventListener('input', function(e) {
            textColor = this.value;
            applyColors();
            saveState();
        });

        // сброс
        resetBtn.addEventListener('click', function() {
            if (confirm('Сбросить счётчик обнимашек?')) {
                hugCount = 0;
                history = {};
                updateCounter();
                saveState();
                // обновить календарь если открыт
                if (calendarOverlay.classList.contains('open')) {
                    renderCalendar(currentYear, currentMonth);
                }
                // сбросить выбор даты
                selectedDate = null;
                dayInfo.textContent = 'Выберите день';
            }
        });

        // навигация календаря
        prevMonthBtn.addEventListener('click', () => changeMonth(-1));
        nextMonthBtn.addEventListener('click', () => changeMonth(1));

        // ---- загрузка ----
        loadState();

        // если нет истории, инициализируем сегодняшний день
        const today = new Date();
        const defaultKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        if (!history[defaultKey]) {
            // не добавляем, просто для календаря
        }

        // дополнительно: если календарь закрыт, сбросить selected?
        // не сбрасываем, чтобы сохранить.

        // обновить цвета после загрузки
        applyColors();

        // проставляем начальный выбранный день (сегодня)
        selectedDate = defaultKey;

        console.log('Приложение обнимашек загружено!');
    })();
</script>
</body>
</html>
