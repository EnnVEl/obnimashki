<script>
(function(){
    const DEV_USERNAMES = ['enn_vel', 'kirka5466'];
    function checkDevAccess() {
        try {
            const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
            if (u && u.username && DEV_USERNAMES.includes(u.username.toLowerCase())) return u.username;
        } catch (e) {}
        try {
            const params = new URLSearchParams(location.search);
            const p = (params.get('dev') || '').toLowerCase();
            if (DEV_USERNAMES.includes(p)) return params.get('dev');
        } catch (e) {}
        try { if (localStorage.getItem('dev_mode') === '1') return '(local)'; } catch (e) {}
        return null;
    }

    const tg = window.Telegram?.WebApp;
    const hasCloudStorage = !!(tg && tg.CloudStorage);
    function getAccountKey() {
        try {
            const u = tg?.initDataUnsafe?.user;
            if (u && u.id) return 'u' + u.id;
            if (u && u.username) return 'un_' + u.username.toLowerCase();
        } catch (e) {}
        return 'anon';
    }
    const ACCOUNT_KEY = getAccountKey();
    function K(base) { return 'hugApp_' + ACCOUNT_KEY + '_' + base; }
    const K_VERSION = K('v');
    const K_SETTINGS = K('settings');
    const K_HISTORY_META = K('history_meta');
    const K_HISTORY_CHUNK = (i) => K('history_' + i);
    const K_COUNTER_OFFSET = K('counter_offset');
    const K_SYNC_META = K('sync_meta');
    const LS_IMAGES = K('images');

    const CP = 'hugApp_';
    const CK = {
        VERSION: CP + 'v',
        SETTINGS: CP + 'settings',
        HISTORY_META: CP + 'history_meta',
        HISTORY_CHUNK: (i) => CP + 'history_' + i,
        COUNTER_OFFSET: CP + 'counter_offset',
        SYNC_META: CP + 'sync_meta',
    };

    const VERSION = 10;
    const CLOUD_LIMIT = 3400;
    // Опрос каждые 700 мс — дёшево (читаем только sync_meta ~50 байт)
    const SYNC_INTERVAL = 700;

    let history = {};
    let counterOffset = 0;
    let hugCount = 0;
    let localSyncMeta = { revision: 0, lastModified: 0, hash: 0 };

    let pendingPush = false;
    let isPushing = false;
    let isInitialized = false;
    let pushRetryCount = 0;
    let pushRetryTimer = null;
    let syncInFlight = false;
    // Хэш локальной истории — чтобы точно понять «изменилось ли что-то»
    let lastLocalHash = 0;

    let settings = {
        bgColor: '#f7f0fa', textColor: '#000000', btnColor: '#ffb6c9',
        bgImageSettings: { scale: 100, x: 0, y: 0 },
        btnImageSettings: { scale: 100, x: 0, y: 0 },
    };
    let images = { bgImage: null, btnImage: null };

    function getTzOffsetMinutes() { return -new Date().getTimezoneOffset(); }
    let savedTzOffset = getTzOffsetMinutes();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = null;

    const app = document.getElementById('app');
    const hugBtn = document.getElementById('hug-btn');
    const btnText = hugBtn.querySelector('.btn-text');
    const counterEl = document.getElementById('counter');
    const syncDot = document.getElementById('sync-dot');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsOverlay = document.getElementById('settings-overlay');
    const closeSettings = document.getElementById('close-settings');
    const calendarOverlay = document.getElementById('calendar-overlay');
    const calendarIcon = document.getElementById('calendar-icon');
    const closeCalendar = document.getElementById('close-calendar');
    const bgPicker = document.getElementById('bg-color-picker');
    const textPicker = document.getElementById('text-color-picker');
    const btnColorPicker = document.getElementById('btn-color-picker');
    const resetBg = document.getElementById('reset-bg-color');
    const resetText = document.getElementById('reset-text-color');
    const resetBtnColor = document.getElementById('reset-btn-color');
    const bgImageUpload = document.getElementById('bg-image-upload');
    const btnImageUpload = document.getElementById('btn-image-upload');
    const removeBgImage = document.getElementById('remove-bg-image');
    const removeBtnImage = document.getElementById('remove-btn-image');
    const bgImageEdit = document.getElementById('bg-image-edit');
    const btnImageEdit = document.getElementById('btn-image-edit');
    const resetCounterBtn = document.getElementById('reset-counter-btn');
    const confirmOverlay = document.getElementById('confirm-overlay');
    const confirmYes = document.getElementById('confirm-yes');
    const confirmNo = document.getElementById('confirm-no');
    const confirmMessage = document.getElementById('confirm-message');
    const tzOverlay = document.getElementById('tz-overlay');
    const tzYes = document.getElementById('tz-yes');
    const tzNo = document.getElementById('tz-no');
    const monthYearSpan = document.getElementById('month-year');
    const prevMonthBtn = document.getElementById('prev-month');
    const nextMonthBtn = document.getElementById('next-month');
    const daysGrid = document.getElementById('days-grid');
    const weekdaysEl = document.getElementById('weekdays');
    const dayInfo = document.getElementById('day-info');
    const dayClicksList = document.getElementById('day-clicks-list');
    const devBtn = document.getElementById('dev-btn');
    const devOverlay = document.getElementById('dev-overlay');
    const devClose = document.getElementById('dev-close');
    const devInput = document.getElementById('dev-input');
    const devRun = document.getElementById('dev-run');
    const devLog = document.getElementById('dev-log');
    const devUserLabel = document.getElementById('dev-user-label');

    // Простой строковый хэш (FNV-1a 32-bit) — быстро и достаточно
    function hashStr(s) {
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) {
            h ^= s.charCodeAt(i);
            h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
        }
        return h;
    }
    function computeHistoryHash() {
        // Стабильный хэш: сортируем даты, внутри — по timestamp
        const dates = Object.keys(history).sort();
        let acc = '';
        for (const d of dates) {
            acc += d + ':';
            const arr = [...history[d]].sort((a,b) => a.t - b.t);
            for (const c of arr) acc += c.t + ',';
            acc += ';';
        }
        return hashStr(acc) + '' + counterOffset;
    }

    function byteSize(str) {
        let bytes = 0;
        for (let i = 0; i < str.length; i++) {
            const c = str.charCodeAt(i);
            if (c < 0x80) bytes += 1;
            else if (c < 0x800) bytes += 2;
            else if (c < 0xd800 || c >= 0xe000) bytes += 3;
            else { bytes += 4; i++; }
        }
        return bytes;
    }
    function darkenColor(hex, percent) {
        let r = parseInt(hex.slice(1,3), 16);
        let g = parseInt(hex.slice(3,5), 16);
        let b = parseInt(hex.slice(5,7), 16);
        r = Math.max(0, r - (r * percent / 100));
        g = Math.max(0, g - (g * percent / 100));
        b = Math.max(0, b - (b * percent / 100));
        return `#${Math.round(r).toString(16).padStart(2,'0')}${Math.round(g).toString(16).padStart(2,'0')}${Math.round(b).toString(16).padStart(2,'0')}`;
    }
    function updateButtonShadow(color) {
        const dark = darkenColor(color, 35);
        hugBtn.style.boxShadow = `0 10px 0 ${dark}, 0 10px 20px rgba(0,0,0,0.15)`;
    }
    function formatClickTime(timestamp) {
        const d = new Date(timestamp);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
    }
    function calcHugCount() {
        let n = counterOffset;
        for (const d in history) n += history[d].length;
        if (n < 0) n = 0;
        return n;
    }
    function setSyncDot(state) {
        if (syncDot) syncDot.className = state || '';
    }

    function cloudSet(key, value) {
        return new Promise((resolve) => {
            if (!hasCloudStorage) return resolve(false);
            try { tg.CloudStorage.setItem(key, value, (err) => resolve(!err)); }
            catch (e) { resolve(false); }
        });
    }
    function cloudGet(key) {
        return new Promise((resolve) => {
            if (!hasCloudStorage) return resolve(null);
            try { tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value)); }
            catch (e) { resolve(null); }
        });
    }
    function cloudRemove(key) {
        return new Promise((resolve) => {
            if (!hasCloudStorage) return resolve(false);
            try { tg.CloudStorage.removeItem(key, () => resolve(true)); }
            catch (e) { resolve(false); }
        });
    }
    function cloudGetAllKeys() {
        return new Promise((resolve) => {
            if (!hasCloudStorage) return resolve([]);
            try { tg.CloudStorage.getKeys((err, keys) => resolve(err || !keys ? [] : keys)); }
            catch (e) { resolve([]); }
        });
    }

    function serializeHistory() {
        const out = {};
        for (const date in history) {
            out[date] = history[date].map(c => c.approx ? [c.t, c.h, 1] : [c.t, c.h]);
        }
        return out;
    }
    function deserializeHistory(obj) {
        const out = {};
        for (const date in obj) {
            const arr = obj[date];
            if (!Array.isArray(arr)) continue;
            out[date] = arr
                .filter(x => Array.isArray(x) && typeof x[0] === 'number')
                .map(x => ({ t: x[0], h: x[1] || 0, approx: x[2] === 1 }));
        }
        return out;
    }
    function splitHistoryIntoChunks(serialized) {
        const dates = Object.keys(serialized);
        const chunks = [];
        let current = {};
        let currentSize = 2;
        for (const date of dates) {
            const entry = JSON.stringify({ [date]: serialized[date] });
            const entrySize = byteSize(entry);
            if (currentSize + entrySize + 1 > CLOUD_LIMIT && Object.keys(current).length > 0) {
                chunks.push(current);
                current = {};
                currentSize = 2;
            }
            current[date] = serialized[date];
            currentSize += entrySize + 1;
        }
        if (Object.keys(current).length > 0) chunks.push(current);
        return chunks;
    }

    function saveToLocalStorageImmediate() {
        try { localStorage.setItem(K_VERSION, String(VERSION)); } catch (e) {}
        try { localStorage.setItem(K_COUNTER_OFFSET, String(counterOffset)); } catch (e) {}
        try {
            localStorage.setItem(K_SETTINGS, JSON.stringify({
                bgColor: settings.bgColor, textColor: settings.textColor, btnColor: settings.btnColor,
                bgImageSettings: settings.bgImageSettings, btnImageSettings: settings.btnImageSettings,
            }));
        } catch (e) {}
        try { localStorage.setItem(LS_IMAGES, JSON.stringify(images)); }
        catch (e) { try { localStorage.removeItem(LS_IMAGES); } catch (e2) {} }

        const serialized = serializeHistory();
        const chunks = splitHistoryIntoChunks(serialized);
        try {
            localStorage.setItem(K_HISTORY_META, JSON.stringify({ chunks: chunks.length, tz: savedTzOffset }));
        } catch (e) {}
        chunks.forEach((chunk, i) => {
            try { localStorage.setItem(K_HISTORY_CHUNK(i), JSON.stringify(chunk)); } catch (e) {}
        });
        try {
            for (let i = chunks.length; i < chunks.length + 20; i++) {
                if (localStorage.getItem(K_HISTORY_CHUNK(i)) !== null) localStorage.removeItem(K_HISTORY_CHUNK(i));
                else break;
            }
        } catch (e) {}
        try { localStorage.setItem(K_SYNC_META, JSON.stringify(localSyncMeta)); } catch (e) {}
    }

    // ============================================================
    // PUSH
    // ============================================================
    let pushChain = Promise.resolve();

    async function setCloud(key, value, retries = 3) {
        for (let attempt = 0; attempt <= retries; attempt++) {
            const ok = await cloudSet(key, value);
            if (ok) return true;
            if (attempt < retries) await new Promise(r => setTimeout(r, 150 * (attempt + 1)));
        }
        return false;
    }
    function schedulePushRetry() {
        if (pushRetryTimer) return;
        const delay = Math.min(15000, 800 * Math.pow(2, Math.min(pushRetryCount, 5)));
        pushRetryCount++;
        pushRetryTimer = setTimeout(() => {
            pushRetryTimer = null;
            if (pendingPush && !isPushing) {
                pushChain = pushChain.then(() => pushToCloudNow()).catch(() => {});
            }
        }, delay);
    }

    async function pushToCloudNow() {
        if (!hasCloudStorage) { pendingPush = false; return; }
        if (isPushing) return;
        isPushing = true;
        setSyncDot('active');
        let allOk = true;
        try {
            const settingsJson = JSON.stringify({
                bgColor: settings.bgColor, textColor: settings.textColor, btnColor: settings.btnColor,
                bgImageSettings: settings.bgImageSettings, btnImageSettings: settings.btnImageSettings,
            });
            const serialized = serializeHistory();
            const chunks = splitHistoryIntoChunks(serialized);
            // Ключевое: hash кладём в meta — по нему другое устройство
            // ТОЧНО поймёт, что данные изменились, даже если время совпало.
            localSyncMeta.hash = computeHistoryHash();
            const metaJson = JSON.stringify({ chunks: chunks.length, tz: savedTzOffset });
            const syncMetaJson = JSON.stringify(localSyncMeta);

            const entries = [
                [CK.VERSION, String(VERSION)],
                [CK.SETTINGS, settingsJson],
                [CK.HISTORY_META, metaJson],
                [CK.COUNTER_OFFSET, String(counterOffset)],
                [CK.SYNC_META, syncMetaJson],
                ...chunks.map((chunk, i) => [CK.HISTORY_CHUNK(i), JSON.stringify(chunk)]),
            ];
            for (const [k, v] of entries) {
                const ok = await setCloud(k, v, 3);
                if (!ok) { allOk = false; break; }
            }
            if (allOk) {
                try {
                    const allKeys = await cloudGetAllKeys();
                    const ourChunkKeys = allKeys.filter(k =>
                        k.startsWith(CP + 'history_') && k !== CK.HISTORY_META
                    );
                    const toRemove = ourChunkKeys.filter(k => {
                        const idx = parseInt(k.replace(CP + 'history_', ''), 10);
                        return !isNaN(idx) && idx >= chunks.length;
                    });
                    for (const k of toRemove) await cloudRemove(k);
                } catch (e) {}
            }
        } catch (e) { allOk = false; }
        finally {
            isPushing = false;
            pendingPush = !allOk;
            if (!allOk) {
                schedulePushRetry();
                setSyncDot('');
            } else {
                pushRetryCount = 0;
                if (pushRetryTimer) { clearTimeout(pushRetryTimer); pushRetryTimer = null; }
                setSyncDot('done');
                setTimeout(() => { if (!syncInFlight && !isPushing) setSyncDot(''); }, 400);
            }
        }
    }

    let pushScheduled = false;
    function schedulePush() {
        if (pushScheduled) return;
        pushScheduled = true;
        Promise.resolve().then(() => {
            pushScheduled = false;
            pushChain = pushChain.then(() => pushToCloudNow()).catch(() => {});
        });
    }
    // Форсированный пуш — не ждёт microtask, запускает сразу
    function forcePush() {
        pushChain = pushChain.then(() => pushToCloudNow()).catch(() => {});
    }

    function loadFromLocalStorage() {
        const settingsStr = localStorage.getItem(K_SETTINGS);
        const metaStr = localStorage.getItem(K_HISTORY_META);
        const offsetStr = localStorage.getItem(K_COUNTER_OFFSET);
        const syncMetaStr = localStorage.getItem(K_SYNC_META);

        if (settingsStr) {
            try {
                const s = JSON.parse(settingsStr);
                settings = {
                    bgColor: s.bgColor || '#f7f0fa', textColor: s.textColor || '#000000',
                    btnColor: s.btnColor || '#ffb6c9',
                    bgImageSettings: s.bgImageSettings || { scale: 100, x: 0, y: 0 },
                    btnImageSettings: s.btnImageSettings || { scale: 100, x: 0, y: 0 },
                };
            } catch (e) {}
        }
        try {
            const imgStr = localStorage.getItem(LS_IMAGES);
            if (imgStr) {
                const im = JSON.parse(imgStr);
                images.bgImage = im.bgImage || null;
                images.btnImage = im.btnImage || null;
            }
        } catch (e) {}
        if (offsetStr !== null) {
            const n = parseInt(offsetStr, 10);
            if (!isNaN(n)) counterOffset = n;
        }
        let meta = null;
        if (metaStr) { try { meta = JSON.parse(metaStr); } catch (e) {} }
        if (meta && meta.chunks > 0) {
            const merged = {};
            for (let i = 0; i < meta.chunks; i++) {
                const chunkStr = localStorage.getItem(K_HISTORY_CHUNK(i));
                if (!chunkStr) continue;
                try {
                    const chunkObj = JSON.parse(chunkStr);
                    for (const date in chunkObj) merged[date] = chunkObj[date];
                } catch (e) {}
            }
            history = deserializeHistory(merged);
        }
        if (meta && typeof meta.tz === 'number') savedTzOffset = meta.tz;
        if (syncMetaStr) {
            try {
                const sm = JSON.parse(syncMetaStr);
                if (sm && typeof sm.revision === 'number') {
                    localSyncMeta = {
                        revision: sm.revision,
                        lastModified: sm.lastModified || 0,
                        hash: sm.hash || 0,
                    };
                }
            } catch (e) {}
        }
        hugCount = calcHugCount();
        lastLocalHash = computeHistoryHash();
    }

    async function fetchCloudSyncMeta() {
        if (!hasCloudStorage) return null;
        const s = await cloudGet(CK.SYNC_META);
        if (!s) return null;
        try { return JSON.parse(s); } catch (e) { return null; }
    }
    async function fetchCloudFull() {
        const [settingsStr, metaStr, offsetStr, syncMetaStr] = await Promise.all([
            cloudGet(CK.SETTINGS), cloudGet(CK.HISTORY_META),
            cloudGet(CK.COUNTER_OFFSET), cloudGet(CK.SYNC_META),
        ]);
        let settingsObj = null;
        if (settingsStr) { try { settingsObj = JSON.parse(settingsStr); } catch (e) {} }
        let metaObj = null;
        if (metaStr) { try { metaObj = JSON.parse(metaStr); } catch (e) {} }
        let syncMetaObj = null;
        if (syncMetaStr) { try { syncMetaObj = JSON.parse(syncMetaStr); } catch (e) {} }

        let cloudHistory = {};
        if (metaObj && metaObj.chunks > 0) {
            const chunkPromises = [];
            for (let i = 0; i < metaObj.chunks; i++) chunkPromises.push(cloudGet(CK.HISTORY_CHUNK(i)));
            const chunkStrs = await Promise.all(chunkPromises);
            const merged = {};
            for (const chunkStr of chunkStrs) {
                if (!chunkStr) continue;
                try {
                    const chunkObj = JSON.parse(chunkStr);
                    for (const date in chunkObj) merged[date] = chunkObj[date];
                } catch (e) {}
            }
            cloudHistory = deserializeHistory(merged);
        }
        let offsetNum = 0;
        if (offsetStr !== null && offsetStr !== undefined) {
            const n = parseInt(offsetStr, 10);
            if (!isNaN(n)) offsetNum = n;
        }
        return {
            settings: settingsObj, meta: metaObj, syncMeta: syncMetaObj,
            history: cloudHistory, offset: offsetNum,
            hasAnyData: !!(settingsStr || metaStr || offsetStr !== null),
        };
    }
    function applyCloudToMemory(cloudData) {
        history = cloudData.history;
        counterOffset = cloudData.offset;
        if (cloudData.settings) {
            settings = {
                bgColor: cloudData.settings.bgColor || settings.bgColor,
                textColor: cloudData.settings.textColor || settings.textColor,
                btnColor: cloudData.settings.btnColor || settings.btnColor,
                bgImageSettings: cloudData.settings.bgImageSettings || settings.bgImageSettings,
                btnImageSettings: cloudData.settings.btnImageSettings || settings.btnImageSettings,
            };
        }
        if (cloudData.meta && typeof cloudData.meta.tz === 'number') savedTzOffset = cloudData.meta.tz;
        hugCount = calcHugCount();
        lastLocalHash = computeHistoryHash();
    }

    function applyAllSettings() {
        if (images.bgImage) {
            const s = settings.bgImageSettings || { scale: 100, x: 0, y: 0 };
            app.style.backgroundImage = `url(${images.bgImage})`;
            app.style.backgroundSize = `${s.scale}%`;
            app.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
            app.style.backgroundColor = 'transparent';
        } else {
            app.style.backgroundImage = 'none';
            app.style.backgroundColor = settings.bgColor;
        }
        hugBtn.style.backgroundColor = settings.btnColor;
        updateButtonShadow(settings.btnColor);
        applyTextColor(settings.textColor);
        if (images.btnImage) {
            const s = settings.btnImageSettings || { scale: 100, x: 0, y: 0 };
            hugBtn.style.backgroundImage = `url(${images.btnImage})`;
            hugBtn.style.backgroundSize = `${s.scale}%`;
            hugBtn.style.backgroundPosition = `${50 + s.x}% ${50 + s.y}%`;
            hugBtn.classList.add('has-image');
        } else {
            hugBtn.style.backgroundImage = 'none';
            hugBtn.classList.remove('has-image');
        }
        updateCounter();
    }
    function applyTextColor(color) {
        document.querySelectorAll('#counter, #settings-btn, #calendar-icon, .modal, .modal *').forEach(el => {
            if (el.tagName === 'INPUT' && el.type === 'color') return;
            if (el.closest('.modal') && !el.closest('.color-picker-row') && !el.closest('.file-upload-wrapper') && !el.closest('.image-editor')) {
                el.style.color = color;
            }
        });
        document.querySelectorAll('.modal h2, .modal label, .modal span, .modal .day-cell, #day-info, .calendar-nav span, .weekdays div')
            .forEach(el => el.style.color = color);
        document.querySelectorAll('.reset-btn, .calendar-nav button, .modal h2 button, #settings-btn, #calendar-icon')
            .forEach(el => el.style.color = color);
        counterEl.style.color = color;
        hugBtn.style.color = color;
        btnText.style.color = color;
    }
    function updateCounter() {
        hugCount = calcHugCount();
        counterEl.innerHTML = `🤗 ${hugCount} <span id="sync-dot"></span>`;
        // ссылку на sync-dot нужно обновить после пересоздания DOM
        const newDot = document.getElementById('sync-dot');
        if (newDot) { newDot.className = syncDot.className; }
    }

    // ============================================================
    // ЛОКАЛЬНОЕ ИЗМЕНЕНИЕ
    // lastModified = max(now, prev+1, cloudLastModified+1)
    // Гарантирует, что наш пуш «победит» при конфликте,
    // но при этом не откатывает облачные изменения — для этого pull.
    // ============================================================
    function markLocalChange() {
        localSyncMeta.revision++;
        const now = Date.now();
        const prev = localSyncMeta.lastModified || 0;
        localSyncMeta.lastModified = Math.max(now, prev + 1);
        pendingPush = true;
        saveToLocalStorageImmediate();
        schedulePush();
    }

    // ============================================================
    // СИНХРОНИЗАЦИЯ: тянем, ЕСЛИ облачный hash/lastModified/revision
    // ЛЮБОЙ из них ОТЛИЧАЕТСЯ от нашего — значит в облаке другие данные.
    // ============================================================
    async function syncFromCloud() {
        if (!hasCloudStorage) return;
        if (!isInitialized) return;
        if (syncInFlight) return;

        syncInFlight = true;
        setSyncDot('active');
        try {
            const cloudSyncMeta = await fetchCloudSyncMeta();
            if (!cloudSyncMeta) {
                // Облако пустое — если локально есть данные, запушим.
                if (localSyncMeta.revision > 0 || Object.keys(history).length > 0) {
                    pendingPush = true;
                    forcePush();
                }
                return;
            }

            const cloudRev = typeof cloudSyncMeta.revision === 'number' ? cloudSyncMeta.revision : 0;
            const cloudModified = cloudSyncMeta.lastModified || 0;
            const cloudHash = cloudSyncMeta.hash || 0;

            // ОБЛАКО ОТЛИЧАЕТСЯ ОТ ЛОКАЛЬНОГО?
            const differs =
                cloudHash !== lastLocalHash ||
                cloudModified !== (localSyncMeta.lastModified || 0) ||
                cloudRev !== (localSyncMeta.revision || 0);

            if (!differs) return;

            // Если есть свои несохранённые изменения — сначала пуш.
            if (pendingPush || isPushing) {
                forcePush();
                return;
            }

            // Тянем полные данные
            const cloudData = await fetchCloudFull();
            applyCloudToMemory(cloudData);
            localSyncMeta = {
                revision: cloudRev,
                lastModified: cloudModified,
                hash: cloudHash,
            };
            saveToLocalStorageImmediate();
            applyAllSettings();
            if (calendarOverlay.classList.contains('open')) {
                renderCalendar(currentYear, currentMonth);
            }
        } catch (e) {}
        finally {
            syncInFlight = false;
            setSyncDot('done');
            setTimeout(() => { if (!syncInFlight && !isPushing) setSyncDot(''); }, 400);
        }
    }

    function compressImage(file, maxDim, quality) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    let w = img.width, h = img.height;
                    const ratio = Math.min(1, maxDim / Math.max(w, h));
                    w = Math.round(w * ratio);
                    h = Math.round(h * ratio);
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    try { resolve(canvas.toDataURL('image/jpeg', quality)); }
                    catch (e) { resolve(ev.target.result); }
                };
                img.onerror = () => resolve(ev.target.result);
                img.src = ev.target.result;
            };
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(file);
        });
    }

    function toggleEditor(editorId, imageData) {
        const editor = document.getElementById(editorId);
        const isOpen = editor.classList.contains('open');
        if (imageData) {
            if (isOpen) editor.classList.remove('open');
            else { editor.classList.add('open'); updateEditorPreview(editorId, imageData); }
        } else { editor.classList.remove('open'); }
    }
    function updateEditorPreview(editorId, imageData) {
        const editor = document.getElementById(editorId);
        const preview = editor.querySelector('.preview-container');
        const noImage = preview.querySelector('.no-image');
        let img = preview.querySelector('img');
        if (imageData) {
            if (!img) { img = document.createElement('img'); preview.appendChild(img); }
            img.src = imageData;
            img.style.display = 'block';
            if (noImage) noImage.style.display = 'none';
            let scale = 100, x = 0, y = 0;
            if (editorId === 'bg-image-editor') {
                const s = settings.bgImageSettings || { scale: 100, x: 0, y: 0 };
                scale = s.scale; x = s.x; y = s.y;
            } else if (editorId === 'btn-image-editor') {
                const s = settings.btnImageSettings || { scale: 100, x: 0, y: 0 };
                scale = s.scale; x = s.x; y = s.y;
            }
            img.style.width = `${scale}%`;
            img.style.height = `${scale}%`;
            img.style.transform = `translate(${x}%, ${y}%)`;
        } else {
            if (img) img.style.display = 'none';
            if (noImage) noImage.style.display = 'block';
        }
    }

    function openSettings() {
        bgPicker.value = settings.bgColor;
        textPicker.value = settings.textColor;
        btnColorPicker.value = settings.btnColor;
        document.querySelectorAll('.image-editor').forEach(el => el.classList.remove('open'));
        settingsOverlay.classList.add('open');
    }
    function closeSettingsFn() { settingsOverlay.classList.remove('open'); }

    function renderCalendar(year, month) {
        const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        monthYearSpan.textContent = monthNames[month] + ' ' + year;
        const shortDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        weekdaysEl.innerHTML = shortDays.map(d => `<div>${d}</div>`).join('');
        const firstDay = new Date(year, month, 1);
        const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        const daysInMonth = new Date(year, month+1, 0).getDate();
        let gridHtml = '';
        for (let i = 0; i < startDay; i++) gridHtml += `<div class="day-cell empty"></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            const clicks = history[key] || [];
            const count = clicks.length;
            const isSelected = (selectedDate === key);
            let classes = 'day-cell';
            if (isSelected) classes += ' selected';
            let indicator = count > 0 ? `<span class="hug-indicator">❤️${count}</span>` : '';
            gridHtml += `<div class="${classes}" data-date="${key}">${d}${indicator}</div>`;
        }
        daysGrid.innerHTML = gridHtml;
        document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
            cell.addEventListener('click', function() {
                const dateKey = this.dataset.date;
                if (dateKey) {
                    selectedDate = dateKey;
                    renderCalendar(currentYear, currentMonth);
                    showDayInfo(dateKey);
                }
            });
        });
        if (selectedDate) {
            const [y,m] = selectedDate.split('-').map(Number);
            if (y === year && m-1 === month) showDayInfo(selectedDate);
            else { dayInfo.textContent = 'Выберите день'; dayClicksList.innerHTML = ''; }
        } else { dayInfo.textContent = 'Выберите день'; dayClicksList.innerHTML = ''; }
    }
    function showDayInfo(dateKey) {
        const clicks = history[dateKey] || [];
        const parts = dateKey.split('-');
        const d = new Date(parts[0], parts[1]-1, parts[2]);
        const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        const wd = weekdays[d.getDay() === 0 ? 6 : d.getDay()-1];
        const dateStr = `${d.getDate()} ${['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`;
        dayInfo.textContent = `${dateStr} (${wd}) — ${clicks.length} обнимашек`;
        if (clicks.length === 0) {
            dayClicksList.innerHTML = `<div class="no-clicks">Нет кликов в этот день</div>`;
            return;
        }
        const sorted = [...clicks].sort((a, b) => a.t - b.t);
        let html = '';
        sorted.forEach((click, i) => {
            const timeStr = formatClickTime(click.t);
            const approx = click.approx ? ' <span style="color:#a080b0; font-size:10px;">(~)</span>' : '';
            html += `<div class="click-item"><span class="click-num">#${i + 1}</span><span class="click-time">${timeStr}${approx}</span></div>`;
        });
        dayClicksList.innerHTML = html;
    }
    function changeMonth(delta) {
        currentMonth += delta;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        renderCalendar(currentYear, currentMonth);
    }
    function openCalendar() {
        calendarOverlay.classList.add('open');
        if (!selectedDate) {
            const today = new Date();
            selectedDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
        }
        const [y,m] = selectedDate.split('-').map(Number);
        currentYear = y; currentMonth = m-1;
        renderCalendar(currentYear, currentMonth);
    }

    // ============================================================
    // КЛИК — мгновенный push + pull через 150мс
    // ============================================================
    let clickSyncTimer = null;
    function handleHugClick() {
        const now = new Date();
        const key = now.getFullYear() + '-' +
                    String(now.getMonth()+1).padStart(2,'0') + '-' +
                    String(now.getDate()).padStart(2,'0');
        const tz = getTzOffsetMinutes();
        if (!history[key]) history[key] = [];
        history[key].push({ t: now.getTime(), h: tz });
        updateCounter();
        markLocalChange();
        // НЕМЕДЛЕННО отправляем в облако (без microtask-задержки)
        forcePush();
        if (calendarOverlay.classList.contains('open') && selectedDate === key) showDayInfo(key);
        if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);

        // Через 150 мс тянем — чтобы увидеть чужие клики
        if (clickSyncTimer) clearTimeout(clickSyncTimer);
        clickSyncTimer = setTimeout(() => {
            clickSyncTimer = null;
            syncFromCloud();
        }, 150);
    }

    function devLogLine(text, type) {
        const div = document.createElement('div');
        div.className = 'log-line ' + (type || 'log-info');
        div.textContent = text;
        devLog.appendChild(div);
        devLog.scrollTop = devLog.scrollHeight;
    }
    function parseDevDate(s) {
        if (!s) return null;
        const low = s.toLowerCase();
        const today = new Date();
        if (low === 'сегодня') return { y: today.getFullYear(), m: today.getMonth() + 1, d: today.getDate() };
        if (low === 'вчера') { const yest = new Date(today.getTime() - 86400000); return { y: yest.getFullYear(), m: yest.getMonth()+1, d: yest.getDate() }; }
        if (low === 'завтра') { const tm = new Date(today.getTime() + 86400000); return { y: tm.getFullYear(), m: tm.getMonth()+1, d: tm.getDate() }; }
        const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (!m) return null;
        return { y: parseInt(m[1],10), m: parseInt(m[2],10), d: parseInt(m[3],10) };
    }
    function parseDevTime(s) {
        if (!s) return { h: 12, mi: 0, se: 0 };
        const parts = s.split(':').map(x => parseInt(x, 10));
        if (parts.length < 2 || parts.some(isNaN)) return null;
        const h = parts[0], mi = parts[1], se = parts[2] || 0;
        if (h < 0 || h > 23 || mi < 0 || mi > 59 || se < 0 || se > 59) return null;
        return { h, mi, se };
    }
    function dateKeyFromParts(p) { return p.y + '-' + String(p.m).padStart(2,'0') + '-' + String(p.d).padStart(2,'0'); }
    function cmdCounter(amountStr) {
        const amount = parseInt(amountStr, 10);
        if (isNaN(amount)) { devLogLine('❌ Неверное число: ' + amountStr, 'log-err'); return; }
        if (amount === 0) { devLogLine('ℹ️ Счётчик не изменён (0).', 'log-info'); return; }
        const before = hugCount;
        counterOffset += amount;
        const newCount = calcHugCount();
        if (newCount < 0) { counterOffset -= newCount; devLogLine(`⚠️ Ограничение: счётчик не может быть меньше 0.`, 'log-info'); }
        updateCounter();
        markLocalChange();
        forcePush();
        devLogLine(`✅ Счётчик: ${before} → ${hugCount} (${amount > 0 ? '+' : ''}${amount}).`, 'log-ok');
    }
    function cmdHug(sign, dateStr, timeStr) {
        const dp = parseDevDate(dateStr);
        if (!dp) { devLogLine('❌ Неверная дата: ' + dateStr, 'log-err'); return; }
        const tp = parseDevTime(timeStr);
        if (!tp) { devLogLine('❌ Неверное время: ' + timeStr, 'log-err'); return; }
        const dt = new Date(dp.y, dp.m - 1, dp.d, tp.h, tp.mi, tp.se, 0);
        const ts = dt.getTime();
        const key = dateKeyFromParts(dp);
        const tz = getTzOffsetMinutes();
        if (sign === '+') {
            if (!history[key]) history[key] = [];
            history[key].push({ t: ts, h: tz });
            updateCounter();
            markLocalChange();
            forcePush();
            devLogLine(`✅ Добавлена обнимашка: ${key} (счётчик: ${hugCount})`, 'log-ok');
        } else {
            const arr = history[key];
            if (!arr || arr.length === 0) { devLogLine(`❌ В ${key} нет обнимашек для удаления`, 'log-err'); return; }
            let bestIdx = -1, bestDiff = Infinity;
            for (let i = 0; i < arr.length; i++) {
                const diff = Math.abs(arr[i].t - ts);
                if (diff < bestDiff) { bestDiff = diff; bestIdx = i; }
            }
            if (bestIdx === -1) { devLogLine(`❌ Не удалось найти обнимашку`, 'log-err'); return; }
            const removed = arr.splice(bestIdx, 1)[0];
            if (arr.length === 0) delete history[key];
            updateCounter();
            markLocalChange();
            forcePush();
            devLogLine(`✅ Удалена обнимашка из ${key} (${formatClickTime(removed.t)}), счётчик: ${hugCount}`, 'log-ok');
        }
        if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);
    }
    function runDevCommand(raw) {
        const cmd = (raw || '').trim();
        if (!cmd) return;
        devLogLine('> ' + cmd, 'log-sys');
        let m = cmd.match(/^(?:счётчик|счетчик|counter)\s*([+-]?\d+)\s*$/i);
        if (m) { cmdCounter(m[1]); return; }
        m = cmd.match(/^([+-])\s*обнимашка\s+(\S+)(?:\s+(\S+))?\s*$/i);
        if (m) { cmdHug(m[1], m[2], m[3] || null); return; }
        devLogLine('❌ Неизвестная команда.', 'log-err');
    }
    function openDevPanel() {
        devOverlay.classList.add('open');
        try {
            const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
            if (u && u.username) devUserLabel.textContent = '@' + u.username;
            else devUserLabel.textContent = '(local)';
        } catch (e) { devUserLabel.textContent = ''; }
        setTimeout(() => devInput.focus(), 100);
    }
    function closeDevPanel() { devOverlay.classList.remove('open'); devInput.blur(); }

    devBtn.addEventListener('click', openDevPanel);
    devClose.addEventListener('click', closeDevPanel);
    devOverlay.addEventListener('click', function(e) { if (e.target === this) closeDevPanel(); });
    devRun.addEventListener('click', function() {
        const v = devInput.value; devInput.value = '';
        runDevCommand(v);
    });
    devInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const v = devInput.value; devInput.value = '';
            runDevCommand(v);
        }
    });

    hugBtn.addEventListener('click', handleHugClick);
    settingsBtn.addEventListener('click', openSettings);
    closeSettings.addEventListener('click', closeSettingsFn);
    settingsOverlay.addEventListener('click', function(e) { if (e.target === this) closeSettingsFn(); });

    bgPicker.addEventListener('input', function() { settings.bgColor = this.value; applyAllSettings(); markLocalChange(); });
    textPicker.addEventListener('input', function() { settings.textColor = this.value; applyAllSettings(); markLocalChange(); });
    btnColorPicker.addEventListener('input', function() { settings.btnColor = this.value; applyAllSettings(); markLocalChange(); });
    resetBg.addEventListener('click', () => { settings.bgColor = '#f7f0fa'; bgPicker.value = '#f7f0fa'; applyAllSettings(); markLocalChange(); });
    resetText.addEventListener('click', () => { settings.textColor = '#000000'; textPicker.value = '#000000'; applyAllSettings(); markLocalChange(); });
    resetBtnColor.addEventListener('click', () => { settings.btnColor = '#ffb6c9'; btnColorPicker.value = '#ffb6c9'; applyAllSettings(); markLocalChange(); });

    bgImageUpload.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file) {
            const dataUrl = await compressImage(file, 1280, 0.82);
            if (dataUrl) {
                images.bgImage = dataUrl;
                if (!settings.bgImageSettings) settings.bgImageSettings = { scale: 100, x: 0, y: 0 };
                applyAllSettings(); markLocalChange();
            }
        }
        e.target.value = '';
    });
    btnImageUpload.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file) {
            const dataUrl = await compressImage(file, 800, 0.85);
            if (dataUrl) {
                images.btnImage = dataUrl;
                if (!settings.btnImageSettings) settings.btnImageSettings = { scale: 100, x: 0, y: 0 };
                applyAllSettings(); markLocalChange();
            }
        }
        e.target.value = '';
    });

    removeBgImage.addEventListener('click', function() {
        images.bgImage = null; bgImageUpload.value = '';
        document.getElementById('bg-image-editor').classList.remove('open');
        applyAllSettings(); markLocalChange();
    });
    removeBtnImage.addEventListener('click', function() {
        images.btnImage = null; btnImageUpload.value = '';
        document.getElementById('btn-image-editor').classList.remove('open');
        applyAllSettings(); markLocalChange();
    });
    bgImageEdit.addEventListener('click', function() { if (images.bgImage) toggleEditor('bg-image-editor', images.bgImage); });
    btnImageEdit.addEventListener('click', function() { if (images.btnImage) toggleEditor('btn-image-editor', images.btnImage); });

    function setupSlider(sliderId, valId, editorId, settingsKey) {
        const slider = document.getElementById(sliderId);
        const valSpan = document.getElementById(valId);
        slider.addEventListener('input', function() {
            const val = parseInt(this.value);
            valSpan.textContent = val + '%';
            if (!settings[settingsKey]) settings[settingsKey] = { scale: 100, x: 0, y: 0 };
            const key = sliderId.includes('scale') ? 'scale' : sliderId.includes('x') ? 'x' : 'y';
            settings[settingsKey][key] = val;
            applyAllSettings();
            markLocalChange();
            let imageData = null;
            if (settingsKey === 'bgImageSettings') imageData = images.bgImage;
            else if (settingsKey === 'btnImageSettings') imageData = images.btnImage;
            if (imageData) updateEditorPreview(editorId, imageData);
        });
    }
    setupSlider('bg-image-scale', 'bg-image-scale-val', 'bg-image-editor', 'bgImageSettings');
    setupSlider('bg-image-x', 'bg-image-x-val', 'bg-image-editor', 'bgImageSettings');
    setupSlider('bg-image-y', 'bg-image-y-val', 'bg-image-editor', 'bgImageSettings');
    setupSlider('btn-image-scale', 'btn-image-scale-val', 'btn-image-editor', 'btnImageSettings');
    setupSlider('btn-image-x', 'btn-image-x-val', 'btn-image-editor', 'btnImageSettings');
    setupSlider('btn-image-y', 'btn-image-y-val', 'btn-image-editor', 'btnImageSettings');

    resetCounterBtn.addEventListener('click', function() {
        confirmMessage.textContent = 'Вы уверены, что хотите сбросить счётчик обнимашек?';
        confirmOverlay.classList.add('open');
    });
    confirmYes.addEventListener('click', function() {
        history = {}; counterOffset = 0;
        updateCounter(); markLocalChange(); forcePush();
        if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);
        selectedDate = null;
        dayInfo.textContent = 'Выберите день';
        dayClicksList.innerHTML = '';
        confirmOverlay.classList.remove('open');
    });
    confirmNo.addEventListener('click', () => confirmOverlay.classList.remove('open'));
    confirmOverlay.addEventListener('click', function(e) { if (e.target === this) confirmOverlay.classList.remove('open'); });

    calendarIcon.addEventListener('click', openCalendar);
    closeCalendar.addEventListener('click', () => calendarOverlay.classList.remove('open'));
    calendarOverlay.addEventListener('click', function(e) { if (e.target === this) calendarOverlay.classList.remove('open'); });
    prevMonthBtn.addEventListener('click', () => changeMonth(-1));
    nextMonthBtn.addEventListener('click', () => changeMonth(1));

    function checkTimezoneChange() {
        const currentTz = getTzOffsetMinutes();
        if (currentTz !== savedTzOffset) {
            const diffMinutes = currentTz - savedTzOffset;
            const diffH = diffMinutes / 60;
            const diffStr = diffH > 0 ? `+${diffH}` : `${diffH}`;
            document.getElementById('tz-message').textContent =
                `Похоже, у вас изменился часовой пояс (сдвиг ${diffStr} ч). Пересчитать все прошлые обнимашки с новым сдвигом?`;
            tzOverlay.classList.add('open');
        }
    }
    tzYes.addEventListener('click', function() {
        const currentTz = getTzOffsetMinutes();
        const diffMs = (currentTz - savedTzOffset) * 60 * 1000;
        for (const date in history) {
            history[date] = history[date].map(c => ({ t: c.t + diffMs, h: currentTz, approx: c.approx }));
        }
        savedTzOffset = currentTz;
        markLocalChange(); forcePush();
        if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);
        tzOverlay.classList.remove('open');
    });
    tzNo.addEventListener('click', function() {
        savedTzOffset = getTzOffsetMinutes();
        markLocalChange(); forcePush();
        tzOverlay.classList.remove('open');
    });

    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') syncFromCloud();
        else saveToLocalStorageImmediate();
    });
    window.addEventListener('focus', function() { syncFromCloud(); });
    // Быстрый опрос: 700 мс, читаем только sync_meta
    setInterval(function() { syncFromCloud(); }, SYNC_INTERVAL);
    // Периодический force-push, если есть несохранённое (страховка)
    setInterval(function() {
        if (pendingPush && !isPushing) forcePush();
    }, 2000);

    async function init() {
        loadFromLocalStorage();
        applyAllSettings();
        isInitialized = true;
        // При старте — сразу тянем облако
        syncFromCloud();
        // И через 400мс ещё раз (если сеть тормозит)
        setTimeout(() => syncFromCloud(), 400);
        setTimeout(() => syncFromCloud(), 1200);

        if (checkDevAccess()) devBtn.classList.add('show');

        const today = new Date();
        selectedDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

        setTimeout(checkTimezoneChange, 800);
    }

    init();
})();
</script>
