<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Обнимашки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #f7f0fa;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            padding: 0;
            margin: 0;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 100%;
            height: 100dvh;
            max-height: 780px;
            background: #f7f0fa;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s, background-image 0.3s;
            background-size: cover;
            background-position: center;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 4px;
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        #counter {
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.5);
            padding: 2px 12px;
            border-radius: 28px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #settings-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 24px;
            transition: 0.2s;
            color: #000000;
        }
        #settings-btn:hover {
            background: rgba(0,0,0,0.04);
        }

        #btn-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 16px;
            min-height: 0;
        }

        #hug-btn {
            aspect-ratio: 1/1;
            width: min(60%, 220px);
            max-width: 260px;
            border-radius: 50%;
            background: #ffb6c9;
            border: none;
            font-size: clamp(22px, 4.5vw, 36px);
            font-weight: 700;
            color: #000000;
            box-shadow: 0 10px 0 #d48a9e, 0 10px 20px rgba(0,0,0,0.15);
            transition: all 0.08s ease, background-color 0.2s, color 0.2s, background-image 0.3s, box-shadow 0.2s;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
            touch-action: manipulation;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            flex-shrink: 0;
        }
        #hug-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 0 #d48a9e, 0 8px 16px rgba(0,0,0,0.12);
        }
        #hug-btn .btn-text {
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: clamp(18px, 3.5vw, 30px);
        }
        #hug-btn.has-image .btn-text {
            opacity: 0.85;
        }

        #bottom-bar {
            display: flex;
            justify-content: flex-start;
            padding: 4px 16px 12px;
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        #calendar-icon {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 28px;
            transition: 0.2s;
            color: #000000;
        }
        #calendar-icon:hover {
            background: rgba(0,0,0,0.04);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #ffffff;
            width: 92%;
            max-width: 340px;
            max-height: 80%;
            border-radius: 28px;
            padding: 18px 16px 16px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.25);
            overflow-y: auto;
            transition: transform 0.2s;
            transform: scale(0.95);
            color: #1f1a2b;
        }
        .overlay.open .modal {
            transform: scale(1);
        }

        .modal h2 {
            font-size: 19px;
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal h2 button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
            color: #4a3a5a;
        }

        .setting-group {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0eaf5;
        }
        .setting-group:last-of-type {
            border-bottom: none;
            margin-bottom: 4px;
        }
        .setting-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 13px;
            color: #3a2a4a;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-picker-row input[type="color"] {
            width: 36px;
            height: 36px;
            border: 2px solid #ddd;
            border-radius: 22px;
            padding: 2px;
            background: white;
            cursor: pointer;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-row input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 22px;
        }

        .file-upload-wrapper {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .file-upload-wrapper label {
            background: #eee8f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #3d2a4a;
        }
        .file-upload-wrapper label:active {
            background: #dcc8e5;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-wrapper .remove-img {
            background: none;
            border: none;
            font-size: 17px;
            cursor: pointer;
            color: #a080b0;
            padding: 2px 6px;
        }
        .file-upload-wrapper .edit-btn {
            background: none;
            border: none;
            font-size: 17px;
            cursor: pointer;
            color: #6a5a7a;
            padding: 2px 6px;
            transition: 0.2s;
        }
        .file-upload-wrapper .edit-btn:hover {
            transform: scale(1.1);
        }

        .btn-small {
            padding: 3px 10px;
            border-radius: 20px;
            border: none;
            background: #e8def0;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            color: #2d1b3d;
        }
        .btn-small:active {
            background: #d0c0dd;
        }

        .image-editor {
            margin-top: 6px;
            padding: 8px;
            background: #f8f2fc;
            border-radius: 14px;
            display: none;
        }
        .image-editor.open {
            display: block;
        }
        .image-editor .slider-group {
            margin-bottom: 6px;
        }
        .image-editor .slider-group label {
            font-size: 11px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            color: #3a2a4a;
        }
        .image-editor input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #dcc8e5;
            border-radius: 6px;
            outline: none;
        }
        .image-editor input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #b094c2;
            cursor: pointer;
        }
        .image-editor .preview-container {
            position: relative;
            width: 100%;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            background: #e8def0;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-editor .preview-container img {
            position: absolute;
            object-fit: cover;
            transition: all 0.1s;
            max-width: none;
            max-height: none;
        }
        .image-editor .no-image {
            color: #887a98;
            font-size: 12px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 10px;
        }
        .calendar-nav button {
            background: #eee8f0;
            border: none;
            font-size: 17px;
            width: 32px;
            height: 32px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #2d1b3d;
        }
        .calendar-nav span {
            font-weight: 600;
            font-size: 15px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            color: #5a4a6a;
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f0fa;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            color: #1f1a2b;
            position: relative;
        }
        .day-cell.empty {
            background: transparent;
            pointer-events: none;
        }
        .day-cell:active {
            background: #dcc8e5;
        }
        .day-cell .hug-indicator {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 9px;
            color: #c44a7a;
        }
        .day-cell.selected {
            background: #d4b0d9;
            color: #1e0f2a;
            font-weight: 600;
        }

        #day-info {
            margin-top: 10px;
            padding: 8px;
            background: #f3edf7;
            border-radius: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #2a1a3a;
        }

        #day-clicks-list {
            margin-top: 10px;
            padding: 8px;
            background: #faf6fd;
            border-radius: 16px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
        }
        #day-clicks-list .click-item {
            padding: 4px 6px;
            border-bottom: 1px solid #eee5f3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2a1a3a;
        }
        #day-clicks-list .click-item:last-child {
            border-bottom: none;
        }
        #day-clicks-list .click-item .click-num {
            color: #887a98;
            font-size: 11px;
            margin-right: 6px;
        }
        #day-clicks-list .click-item .click-time {
            font-weight: 600;
            font-feature-settings: "tnum";
        }
        #day-clicks-list .no-clicks {
            text-align: center;
            color: #887a98;
            font-size: 12px;
            padding: 6px;
        }

        .modal::-webkit-scrollbar {
            width: 3px;
        }
        .modal::-webkit-scrollbar-track {
            background: #ece4f0;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #b8a2c7;
            border-radius: 6px;
        }

        .reset-btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 28px;
            background: #f0e6f5;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #3d2a4a;
            transition: 0.2s;
        }
        .reset-btn:active {
            background: #dcc8e5;
        }

        @media (max-height: 700px) {
            #header { padding: 8px 12px 2px; }
            #counter { font-size: 18px; padding: 2px 10px; }
            #settings-btn { font-size: 20px; }
            #hug-btn { width: min(50%, 170px); }
            #hug-btn .btn-text { font-size: clamp(14px, 3vw, 22px); }
            #bottom-bar { padding: 2px 12px 8px; }
            #calendar-icon { font-size: 22px; }
            .modal { padding: 12px; max-height: 78%; }
            .modal h2 { font-size: 16px; margin-bottom: 8px; }
            .setting-group { margin-bottom: 8px; padding-bottom: 6px; }
            .setting-group label { font-size: 12px; }
        }

        @media (max-height: 600px) {
            #hug-btn { width: min(40%, 130px); }
            #hug-btn .btn-text { font-size: clamp(12px, 2.5vw, 18px); }
            #header { padding: 4px 10px 0px; }
            #counter { font-size: 15px; padding: 1px 8px; }
            #bottom-bar { padding: 0px 10px 4px; }
            #settings-btn { font-size: 18px; }
            #calendar-icon { font-size: 18px; }
            .modal { padding: 10px; max-height: 75%; }
            .modal h2 { font-size: 14px; margin-bottom: 6px; }
            .setting-group { margin-bottom: 6px; padding-bottom: 4px; }
        }

        .confirm-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .confirm-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .confirm-box {
            background: #ffffff;
            padding: 20px 24px 18px;
            border-radius: 24px;
            max-width: 300px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.2s;
        }
        .confirm-overlay.open .confirm-box {
            transform: scale(1);
        }
        .confirm-box h3 {
            font-size: 17px;
            margin-bottom: 6px;
            color: #2d1b3d;
        }
        .confirm-box p {
            font-size: 13px;
            color: #5a4a6a;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .confirm-box .confirm-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .confirm-box .confirm-btns button {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .confirm-box .confirm-btns .confirm-yes {
            background: #d48a9e;
            color: white;
        }
        .confirm-box .confirm-btns .confirm-yes:active {
            background: #c07a8e;
        }
        .confirm-box .confirm-btns .confirm-no {
            background: #f0e6f5;
            color: #3d2a4a;
        }
        .confirm-box .confirm-btns .confirm-no:active {
            background: #dcc8e5;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="header">
        <span id="counter">🤗 0</span>
        <button id="settings-btn" aria-label="Настройки">⚙️</button>
    </div>

    <div id="btn-container">
        <button id="hug-btn">
            <span class="btn-text">обнимашки</span>
        </button>
    </div>

    <div id="bottom-bar">
        <button id="calendar-icon" aria-label="Календарь">📅</button>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="modal" id="settings-modal">
            <h2>Настройки <button id="close-settings">✕</button></h2>

            <div class="setting-group">
                <label>Цвет фона приложения</label>
                <div class="color-picker-row">
                    <input type="color" id="bg-color-picker" value="#f7f0fa">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-bg-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <div class="setting-group">
                <label>Фото на фон приложения</label>
                <div class="file-upload-wrapper">
                    <label for="bg-image-upload">📁 Загрузить</label>
                    <input type="file" id="bg-image-upload" accept="image/*">
                    <button class="edit-btn" id="bg-image-edit" title="Редактировать">✏️</button>
                    <button class="remove-img" id="remove-bg-image" title="Удалить фото">✕</button>
                </div>
                <div class="image-editor" id="bg-image-editor">
                    <div class="preview-container" id="bg-image-preview">
                        <span class="no-image">Нет фото</span>
                    </div>
                    <div class="slider-group">
                        <label>Масштаб <span id="bg-image-scale-val">100%</span></label>
                        <input type="range" id="bg-image-scale" min="50" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Смещение X <span id="bg-image-x-val">0%</span></label>
                        <input type="range" id="bg-image-x" min="-50" max="50" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Смещение Y <span id="bg-image-y-val">0%</span></label>
                        <input type="range" id="bg-image-y" min="-50" max="50" value="0">
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label>Цвет самой кнопки</label>
                <div class="color-picker-row">
                    <input type="color" id="btn-color-picker" value="#ffb6c9">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-btn-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <div class="setting-group">
                <label>Фото на кнопку</label>
                <div class="file-upload-wrapper">
                    <label for="btn-image-upload">📁 Загрузить</label>
                    <input type="file" id="btn-image-upload" accept="image/*">
                    <button class="edit-btn" id="btn-image-edit" title="Редактировать">✏️</button>
                    <button class="remove-img" id="remove-btn-image" title="Удалить фото">✕</button>
                </div>
                <div class="image-editor" id="btn-image-editor">
                    <div class="preview-container" id="btn-image-preview">
                        <span class="no-image">Нет фото</span>
                    </div>
                    <div class="slider-group">
                        <label>Масштаб <span id="btn-image-scale-val">100%</span></label>
                        <input type="range" id="btn-image-scale" min="50" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Смещение X <span id="btn-image-x-val">0%</span></label>
                        <input type="range" id="btn-image-x" min="-50" max="50" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Смещение Y <span id="btn-image-y-val">0%</span></label>
                        <input type="range" id="btn-image-y" min="-50" max="50" value="0">
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label>Цвет текста</label>
                <div class="color-picker-row">
                    <input type="color" id="text-color-picker" value="#000000">
                    <span style="font-size:12px; color:#5a4a6a;">выберите</span>
                    <button class="btn-small" id="reset-text-color" style="margin-left:auto;">Сбросить</button>
                </div>
            </div>

            <div class="setting-group" style="border-bottom: none; margin-bottom: 0;">
                <button class="reset-btn" id="reset-counter-btn">Сбросить счётчик</button>
            </div>
        </div>
    </div>

    <div id="calendar-overlay" class="overlay">
        <div class="modal" id="calendar-modal">
            <h2>📅 Календарь <button id="close-calendar">✕</button></h2>
            <div class="calendar-nav">
                <button id="prev-month">‹</button>
                <span id="month-year">Январь 2026</span>
                <button id="next-month">›</button>
            </div>
            <div class="weekdays" id="weekdays"></div>
            <div class="days-grid" id="days-grid"></div>
            <div id="day-info">Выберите день</div>
            <div id="day-clicks-list"></div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <h3>⚠️ Подтверждение</h3>
            <p id="confirm-message">Вы уверены, что хотите сбросить счётчик обнимашек?</p>
            <div class="confirm-btns">
                <button class="confirm-yes" id="confirm-yes">Да</button>
                <button class="confirm-no" id="confirm-no">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно смены часового пояса -->
    <div class="confirm-overlay" id="tz-overlay">
        <div class="confirm-box">
            <h3>🕒 Изменился часовой пояс</h3>
            <p id="tz-message">Похоже, у вас изменился часовой пояс. Пересчитать все прошлые обнимашки с новым сдвигом?</p>
            <div class="confirm-btns">
                <button class="confirm-yes" id="tz-yes">Да, пересчитать</button>
                <button class="confirm-no" id="tz-no">Нет, оставить</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ============================================================
        // СИСТЕМА ХРАНЕНИЯ
        // ============================================================
        // CloudStorage имеет лимит 4096 байт на КЛЮЧ и 1024 ключа.
        // Поэтому:
        //   - счётчик -> отдельный ключ (tiny)
        //   - настройки (без картинок) -> отдельный ключ (small)
        //   - картинки -> только localStorage (big base64)
        //   - история -> разбивается на чанки по ~3.5 КБ: history_0, history_1, ...
        // ============================================================

        const tg = window.Telegram?.WebApp;
        const hasCloudStorage = !!(tg && tg.CloudStorage);
        const VERSION = 2;

        const K_VERSION   = 'hugApp_v';
        const K_COUNT     = 'hugApp_count';
        const K_SETTINGS  = 'hugApp_settings';
        const K_HISTORY_META = 'hugApp_history_meta'; // { chunks: N, tz: offset }
        const K_HISTORY_CHUNK = (i) => 'hugApp_history_' + i;

        // Картинки — только localStorage, т.к. base64 не влезает в 4КБ CloudStorage
        const LS_IMAGES = 'hugApp_images';

        const CLOUD_LIMIT = 3800; // оставляем запас от 4096

        // ---- Данные в памяти ----
        let hugCount = 0;
        // history: { "YYYY-MM-DD": [ {t: ms, h: tzOffsetMin, approx?:true} ] }
        let history = {};

        let settings = {
            bgColor: '#f7f0fa',
            textColor: '#000000',
            btnColor: '#ffb6c9',
            bgImageSettings: { scale: 100, x: 0, y: 0 },
            btnImageSettings: { scale: 100, x: 0, y: 0 },
        };
        // Картинки отдельно (не улетают в CloudStorage)
        let images = { bgImage: null, btnImage: null };

        function getTzOffsetMinutes() {
            return -new Date().getTimezoneOffset();
        }
        let savedTzOffset = getTzOffsetMinutes();

        // ---- Календарь ----
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDate = null;

        // ---- DOM ----
        const app = document.getElementById('app');
        const hugBtn = document.getElementById('hug-btn');
        const btnText = hugBtn.querySelector('.btn-text');
        const counterEl = document.getElementById('counter');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const closeSettings = document.getElementById('close-settings');
        const calendarOverlay = document.getElementById('calendar-overlay');

        // ============================================================
        // УТИЛИТЫ
        // ============================================================
        function byteSize(str) {
            // Приблизительная оценка размера UTF-8 строки
            let bytes = 0;
            for (let i = 0; i < str.length; i++) {
                const c = str.charCodeAt(i);
                if (c < 0x80) bytes += 1;
                else if (c < 0x800) bytes += 2;
                else if (c < 0xd800 || c >= 0xe000) bytes += 3;
                else { bytes += 4; i++; }
            }
            return bytes;
        }

        function darkenColor(hex, percent) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            r = Math.max(0, r - (r * percent / 100));
            g = Math.max(0, g - (g * percent / 100));
            b = Math.max(0, b - (b * percent / 100));
            return `#${Math.round(r).toString(16).padStart(2,'0')}${Math.round(g).toString(16).padStart(2,'0')}${Math.round(b).toString(16).padStart(2,'0')}`;
        }

        function updateButtonShadow(color) {
            const dark = darkenColor(color, 35);
            hugBtn.style.boxShadow = `0 10px 0 ${dark}, 0 10px 20px rgba(0,0,0,0.15)`;
        }

        function formatClickTime(timestamp) {
            const d = new Date(timestamp);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;
        }

        // ============================================================
        // ОБЁРТКА НАД CLOUDSTORAGE (промис)
        // ============================================================
        function cloudSet(key, value) {
            return new Promise((resolve) => {
                if (!hasCloudStorage) return resolve(false);
                try {
                    tg.CloudStorage.setItem(key, value, (err) => {
                        if (err) resolve(false); else resolve(true);
                    });
                } catch (e) { resolve(false); }
            });
        }
        function cloudGet(key) {
            return new Promise((resolve) => {
                if (!hasCloudStorage) return resolve(null);
                try {
                    tg.CloudStorage.getItem(key, (err, value) => {
                        if (err || !value) resolve(null); else resolve(value);
                    });
                } catch (e) { resolve(null); }
            });
        }
        function cloudRemove(key) {
            return new Promise((resolve) => {
                if (!hasCloudStorage) return resolve(false);
                try {
                    tg.CloudStorage.removeItem(key, () => resolve(true));
                } catch (e) { resolve(false); }
            });
        }
        function cloudGetAllKeys() {
            return new Promise((resolve) => {
                if (!hasCloudStorage) return resolve([]);
                try {
                    tg.CloudStorage.getKeys((err, keys) => {
                        if (err || !keys) resolve([]); else resolve(keys);
                    });
                } catch (e) { resolve([]); }
            });
        }

        // ============================================================
        // СЕРИАЛИЗАЦИЯ ИСТОРИИ (компактная + чанками)
        // ============================================================
        // Компактный формат: { "YYYY-MM-DD": [[t, h, approx?], ...] }
        // Это экономит ~50% места против объектов {t:..., h:...}
        function serializeHistory() {
            const out = {};
            for (const date in history) {
                out[date] = history[date].map(c => c.approx ? [c.t, c.h, 1] : [c.t, c.h]);
            }
            return out;
        }

        function deserializeHistory(obj) {
            const out = {};
            for (const date in obj) {
                const arr = obj[date];
                if (!Array.isArray(arr)) continue;
                out[date] = arr
                    .filter(x => Array.isArray(x) && typeof x[0] === 'number')
                    .map(x => ({ t: x[0], h: x[1] || 0, approx: x[2] === 1 }));
            }
            return out;
        }

        // Разбиваем историю на чанки так, чтобы каждый чанк был < CLOUD_LIMIT
        function splitHistoryIntoChunks(serialized) {
            const dates = Object.keys(serialized);
            const chunks = [];
            let current = {};
            let currentSize = 2; // '{}'

            for (const date of dates) {
                const entry = JSON.stringify({ [date]: serialized[date] });
                const entrySize = byteSize(entry);
                // +1 на запятую между записями
                if (currentSize + entrySize + 1 > CLOUD_LIMIT && Object.keys(current).length > 0) {
                    chunks.push(current);
                    current = {};
                    currentSize = 2;
                }
                current[date] = serialized[date];
                currentSize += entrySize + 1;
            }
            if (Object.keys(current).length > 0) chunks.push(current);
            return chunks;
        }

        // ============================================================
        // СОХРАНЕНИЕ
        // ============================================================
        let saveTimer = null;
        let savePending = false;

        function persistData() {
            // Дебаунс: CloudStorage не любит частые вызовы
            if (saveTimer) { savePending = true; return; }
            doPersist();
            saveTimer = setTimeout(() => {
                saveTimer = null;
                if (savePending) { savePending = false; doPersist(); }
            }, 250);
        }

        async function doPersist() {
            // 1) Картинки — в localStorage (base64 не влезает в 4КБ cloud)
            try {
                localStorage.setItem(LS_IMAGES, JSON.stringify(images));
            } catch (e) {
                // Если переполнено — жертвуем картинками, чистим старьё
                try { localStorage.removeItem(LS_IMAGES); } catch (e2) {}
            }

            // 2) Настройки (без картинок) — в CloudStorage
            const settingsJson = JSON.stringify({
                bgColor: settings.bgColor,
                textColor: settings.textColor,
                btnColor: settings.btnColor,
                bgImageSettings: settings.bgImageSettings,
                btnImageSettings: settings.btnImageSettings,
            });

            // 3) История — чанками
            const serialized = serializeHistory();
            const chunks = splitHistoryIntoChunks(serialized);

            const results = await Promise.all([
                cloudSet(K_VERSION, String(VERSION)),
                cloudSet(K_COUNT, String(hugCount)),
                cloudSet(K_SETTINGS, settingsJson),
                cloudSet(K_HISTORY_META, JSON.stringify({
                    chunks: chunks.length,
                    tz: savedTzOffset,
                })),
                ...chunks.map((chunk, i) => cloudSet(K_HISTORY_CHUNK(i), JSON.stringify(chunk))),
            ]);

            const allOk = results.every(r => r);

            // 4) Резервная копия в localStorage (на случай если CloudStorage отвалился)
            try {
                localStorage.setItem(K_COUNT, String(hugCount));
                localStorage.setItem(K_SETTINGS, settingsJson);
                localStorage.setItem(K_HISTORY_META, JSON.stringify({
                    chunks: chunks.length,
                    tz: savedTzOffset,
                }));
                chunks.forEach((chunk, i) => {
                    try { localStorage.setItem(K_HISTORY_CHUNK(i), JSON.stringify(chunk)); } catch (e) {}
                });

                // Чистим лишние чанки (если история сжалась)
                const allKeys = await cloudGetAllKeys();
                const ourChunkKeys = allKeys.filter(k => k.startsWith('hugApp_history_') && k !== 'hugApp_history_meta');
                for (const k of ourChunkKeys) {
                    const idx = parseInt(k.replace('hugApp_history_', ''), 10);
                    if (!isNaN(idx) && idx >= chunks.length) {
                        cloudRemove(k);
                    }
                }
            } catch (e) {}

            if (!allOk && hasCloudStorage) {
                console.warn('Часть данных не сохранилась в CloudStorage');
            }
        }

        // ============================================================
        // ЗАГРУЗКА
        // ============================================================
        async function loadData() {
            // 1) Сначала пробуем CloudStorage
            let countStr = await cloudGet(K_COUNT);
            let settingsStr = await cloudGet(K_SETTINGS);
            let metaStr = await cloudGet(K_HISTORY_META);

            // 2) Если cloud пустой — читаем из localStorage
            if (countStr === null) countStr = localStorage.getItem(K_COUNT);
            if (settingsStr === null) settingsStr = localStorage.getItem(K_SETTINGS);
            if (metaStr === null) metaStr = localStorage.getItem(K_HISTORY_META);

            // ---- Счётчик ----
            if (countStr !== null) {
                const n = parseInt(countStr, 10);
                if (!isNaN(n) && n >= 0) hugCount = n;
            }

            // ---- Настройки ----
            if (settingsStr) {
                try {
                    const s = JSON.parse(settingsStr);
                    settings = {
                        bgColor: s.bgColor || '#f7f0fa',
                        textColor: s.textColor || '#000000',
                        btnColor: s.btnColor || '#ffb6c9',
                        bgImageSettings: s.bgImageSettings || { scale: 100, x: 0, y: 0 },
                        btnImageSettings: s.btnImageSettings || { scale: 100, x: 0, y: 0 },
                    };
                } catch (e) {}
            }

            // ---- Картинки ----
            try {
                const imgStr = localStorage.getItem(LS_IMAGES);
                if (imgStr) {
                    const im = JSON.parse(imgStr);
                    images.bgImage = im.bgImage || null;
                    images.btnImage = im.btnImage || null;
                }
            } catch (e) {}

            // ---- Мета истории ----
            let meta = null;
            if (metaStr) {
                try { meta = JSON.parse(metaStr); } catch (e) {}
            }

            // ---- История ----
            if (meta && meta.chunks > 0) {
                // Новый формат: чанки
                const merged = {};
                for (let i = 0; i < meta.chunks; i++) {
                    let chunkStr = await cloudGet(K_HISTORY_CHUNK(i));
                    if (chunkStr === null) chunkStr = localStorage.getItem(K_HISTORY_CHUNK(i));
                    if (!chunkStr) continue;
                    try {
                        const chunkObj = JSON.parse(chunkStr);
                        for (const date in chunkObj) merged[date] = chunkObj[date];
                    } catch (e) {}
                }
                history = deserializeHistory(merged);
            } else {
                // Попытка прочитать СТАРЫЙ формат (монолитный ключ hugAppData)
                // и мигрировать в новый
                let legacy = await cloudGet('hugAppData');
                if (!legacy) legacy = localStorage.getItem('hugAppData');
                if (legacy) {
                    try {
                        const parsed = JSON.parse(legacy);
                        if (parsed.settings) {
                            settings = {
                                bgColor: parsed.settings.bgColor || settings.bgColor,
                                textColor: parsed.settings.textColor || settings.textColor,
                                btnColor: parsed.settings.btnColor || settings.btnColor,
                                bgImageSettings: parsed.settings.bgImageSettings || settings.bgImageSettings,
                                btnImageSettings: parsed.settings.btnImageSettings || settings.btnImageSettings,
                            };
                            // Картинки из старого формата переносим в images
                            if (parsed.settings.bgImage) images.bgImage = parsed.settings.bgImage;
                            if (parsed.settings.btnImage) images.btnImage = parsed.settings.btnImage;
                        }
                        if (typeof parsed.savedTzOffset === 'number') savedTzOffset = parsed.savedTzOffset;
                        if (typeof parsed.count === 'number' && parsed.count > hugCount) hugCount = parsed.count;
                        if (parsed.history) {
                            // Может быть старый формат (число) или новый (массив)
                            const h = {};
                            for (const date in parsed.history) {
                                const v = parsed.history[date];
                                if (Array.isArray(v)) {
                                    h[date] = v
                                        .filter(x => x && typeof x.t === 'number')
                                        .map(x => ({ t: x.t, h: x.h || 0, approx: !!x.approx }));
                                } else if (typeof v === 'number') {
                                    // Древний формат: N кликов без времени
                                    const [y, m, d] = date.split('-').map(Number);
                                    const arr = [];
                                    for (let k = 0; k < v; k++) {
                                        const base = new Date(y, m - 1, d, 12, 0, 0, k * 1000);
                                        arr.push({ t: base.getTime(), h: savedTzOffset, approx: true });
                                    }
                                    h[date] = arr;
                                }
                            }
                            history = h;
                        }
                        // После миграции сохраним в новом формате
                        // (сделаем это в init после применения настроек)
                    } catch (e) {}
                }
            }

            // Если savedTzOffset не был загружен — берём текущий
            if (meta && typeof meta.tz === 'number') {
                savedTzOffset = meta.tz;
            }
        }

        // ============================================================
        // СЖАТИЕ КАРТИНОК (чтобы не раздувать localStorage)
        // ============================================================
        function compressImage(file, maxDim, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        let w = img.width, h = img.height;
                        const ratio = Math.min(1, maxDim / Math.max(w, h));
                        w = Math.round(w * ratio);
                        h = Math.round(h * ratio);
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        try {
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve(dataUrl);
                        } catch (e) {
                            resolve(ev.target.result);
                        }
                    };
                    img.onerror = () => resolve(ev.target.result);
                    img.src = ev.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        // РЕДАКТОР ИЗОБРАЖЕНИЙ
        // ============================================================
        function toggleEditor(editorId, imageData) {
            const editor = document.getElementById(editorId);
            const isOpen = editor.classList.contains('open');
            if (imageData) {
                if (isOpen) editor.classList.remove('open');
                else {
                    editor.classList.add('open');
                    updateEditorPreview(editorId, imageData);
                }
            } else {
                editor.classList.remove('open');
            }
        }

        function updateEditorPreview(editorId, imageData) {
            const editor = document.getElementById(editorId);
            const preview = editor.querySelector('.preview-container');
            const noImage = preview.querySelector('.no-image');
            let img = preview.querySelector('img');

            if (imageData) {
                if (!img) {
                    img = document.createElement('img');
                    preview.appendChild(img);
                }
                img.src = imageData;
                img.style.display = 'block';
                if (noImage) noImage.style.display = 'none';

                let scale = 100, x = 0, y = 0;
                if (editorId === 'bg-image-editor') {
                    const s = settings.bgImageSettings || { scale: 100, x: 0, y: 0 };
                    scale = s.scale; x = s.x; y = s.y;
                } else if (editorId === 'btn-image-editor') {
                    const s = settings.btnImageSettings || { scale: 100, x: 0, y: 0 };
                    scale = s.scale; x = s.x; y = s.y;
                }
                img.style.width = `${scale}%`;
                img.style.height = `${scale}%`;
                img.style.transform = `translate(${x}%, ${y}%)`;
            } else {
                if (img) img.style.display = 'none';
                if (noImage) noImage.style.display = 'block';
            }
        }

        // ============================================================

        // ============================================================
        function renderCalendar(year, month) {
            const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
            monthYearSpan.textContent = monthNames[month] + ' ' + year;

            const shortDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            weekdaysEl.innerHTML = shortDays.map(d => `<div>${d}</div>`).join('');

            const firstDay = new Date(year, month, 1);
            const startDay = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
            const daysInMonth = new Date(year, month+1, 0).getDate();

            let gridHtml = '';
            for (let i = 0; i < startDay; i++) {
                gridHtml += `<div class="day-cell empty"></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
                const clicks = history[key] || [];
                const count = clicks.length;
                const isSelected = (selectedDate === key);
                let classes = 'day-cell';
                if (isSelected) classes += ' selected';
                let indicator = count > 0 ? `<span class="hug-indicator">❤️${count}</span>` : '';
                gridHtml += `<div class="${classes}" data-date="${key}">${d}${indicator}</div>`;
            }

            daysGrid.innerHTML = gridHtml;

            document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
                cell.addEventListener('click', function() {
                    const dateKey = this.dataset.date;
                    if (dateKey) {
                        selectedDate = dateKey;
                        renderCalendar(currentYear, currentMonth);
                        showDayInfo(dateKey);
                    }
                });
            });

            if (selectedDate) {
                const [y,m] = selectedDate.split('-').map(Number);
                if (y === year && m-1 === month) {
                    showDayInfo(selectedDate);
                } else {
                    dayInfo.textContent = 'Выберите день';
                    dayClicksList.innerHTML = '';
                }
            } else {
                dayInfo.textContent = 'Выберите день';
                dayClicksList.innerHTML = '';
            }
        }

        function showDayInfo(dateKey) {
            const clicks = history[dateKey] || [];
            const parts = dateKey.split('-');
            const d = new Date(parts[0], parts[1]-1, parts[2]);
            const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
            const wd = weekdays[d.getDay() === 0 ? 6 : d.getDay()-1];
            const dateStr = `${d.getDate()} ${['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`;
            dayInfo.textContent = `${dateStr} (${wd}) — ${clicks.length} обнимашек`;

            if (clicks.length === 0) {
                dayClicksList.innerHTML = `<div class="no-clicks">Нет кликов в этот день</div>`;
                return;
            }

            const sorted = [...clicks].sort((a, b) => a.t - b.t);

            let html = '';
            sorted.forEach((click, i) => {
                const timeStr = formatClickTime(click.t);
                const approx = click.approx ? ' <span style="color:#a080b0; font-size:10px;">(~)</span>' : '';
                html += `
                    <div class="click-item">
                        <span class="click-num">#${i + 1}</span>
                        <span class="click-time">${timeStr}${approx}</span>
                    </div>
                `;
            });
            dayClicksList.innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        }

        function openCalendar() {
            calendarOverlay.classList.add('open');
            if (!selectedDate) {
                const today = new Date();
                selectedDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
            }
            const [y,m] = selectedDate.split('-').map(Number);
            currentYear = y;
            currentMonth = m-1;
            renderCalendar(currentYear, currentMonth);
        }

        // ============================================================
        // КЛИК ПО КНОПКЕ
        // ============================================================
        function handleHugClick() {
            hugCount++;
            const now = new Date();
            const key = now.getFullYear() + '-' +
                        String(now.getMonth()+1).padStart(2,'0') + '-' +
                        String(now.getDate()).padStart(2,'0');

            const tz = getTzOffsetMinutes();

            if (!history[key]) history[key] = [];
            history[key].push({ t: now.getTime(), h: tz });

            updateCounter();
            persistData();

            if (calendarOverlay.classList.contains('open') && selectedDate === key) {
                showDayInfo(key);
            }
            if (calendarOverlay.classList.contains('open')) {
                renderCalendar(currentYear, currentMonth);
            }
        }

        // ============================================================
        // СОБЫТИЯ
        // ============================================================
        hugBtn.addEventListener('click', handleHugClick);

        settingsBtn.addEventListener('click', openSettings);
        closeSettings.addEventListener('click', closeSettingsFn);
        settingsOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeSettingsFn();
        });

        bgPicker.addEventListener('input', function() {
            settings.bgColor = this.value;
            saveAndApply();
        });
        textPicker.addEventListener('input', function() {
            settings.textColor = this.value;
            saveAndApply();
        });
        btnColorPicker.addEventListener('input', function() {
            settings.btnColor = this.value;
            saveAndApply();
        });

        resetBg.addEventListener('click', () => {
            settings.bgColor = '#f7f0fa';
            bgPicker.value = '#f7f0fa';
            saveAndApply();
        });
        resetText.addEventListener('click', () => {
            settings.textColor = '#000000';
            textPicker.value = '#000000';
            saveAndApply();
        });
        resetBtnColor.addEventListener('click', () => {
            settings.btnColor = '#ffb6c9';
            btnColorPicker.value = '#ffb6c9';
            saveAndApply();
        });

        // Загрузка фото со сжатием
        bgImageUpload.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                const dataUrl = await compressImage(file, 1280, 0.82);
                if (dataUrl) {
                    images.bgImage = dataUrl;
                    if (!settings.bgImageSettings) settings.bgImageSettings = { scale: 100, x: 0, y: 0 };
                    saveAndApply();
                }
            }
            e.target.value = '';
        });

        btnImageUpload.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                const dataUrl = await compressImage(file, 800, 0.85);
                if (dataUrl) {
                    images.btnImage = dataUrl;
                    if (!settings.btnImageSettings) settings.btnImageSettings = { scale: 100, x: 0, y: 0 };
                    saveAndApply();
                }
            }
            e.target.value = '';
        });

        removeBgImage.addEventListener('click', function() {
            images.bgImage = null;
            bgImageUpload.value = '';
            document.getElementById('bg-image-editor').classList.remove('open');
            saveAndApply();
        });
        removeBtnImage.addEventListener('click', function() {
            images.btnImage = null;
            btnImageUpload.value = '';
            document.getElementById('btn-image-editor').classList.remove('open');
            saveAndApply();
        });

        bgImageEdit.addEventListener('click', function() {
            if (images.bgImage) toggleEditor('bg-image-editor', images.bgImage);
        });
        btnImageEdit.addEventListener('click', function() {
            if (images.btnImage) toggleEditor('btn-image-editor', images.btnImage);
        });

        function setupSlider(sliderId, valId, editorId, settingsKey) {
            const slider = document.getElementById(sliderId);
            const valSpan = document.getElementById(valId);
            slider.addEventListener('input', function() {
                const val = parseInt(this.value);
                valSpan.textContent = val + '%';
                if (!settings[settingsKey]) settings[settingsKey] = { scale: 100, x: 0, y: 0 };
                const key = sliderId.includes('scale') ? 'scale' : sliderId.includes('x') ? 'x' : 'y';
                settings[settingsKey][key] = val;
                saveAndApply();
                let imageData = null;
                if (settingsKey === 'bgImageSettings') imageData = images.bgImage;
                else if (settingsKey === 'btnImageSettings') imageData = images.btnImage;
                if (imageData) updateEditorPreview(editorId, imageData);
            });
        }

        setupSlider('bg-image-scale', 'bg-image-scale-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('bg-image-x', 'bg-image-x-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('bg-image-y', 'bg-image-y-val', 'bg-image-editor', 'bgImageSettings');
        setupSlider('btn-image-scale', 'btn-image-scale-val', 'btn-image-editor', 'btnImageSettings');
        setupSlider('btn-image-x', 'btn-image-x-val', 'btn-image-editor', 'btnImageSettings');
        setupSlider('btn-image-y', 'btn-image-y-val', 'btn-image-editor', 'btnImageSettings');

        resetCounterBtn.addEventListener('click', function() {
            confirmMessage.textContent = 'Вы уверены, что хотите сбросить счётчик обнимашек?';
            confirmOverlay.classList.add('open');
        });
        confirmYes.addEventListener('click', function() {
            hugCount = 0;
            history = {};
            updateCounter();
            persistData();
            if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);
            selectedDate = null;
            dayInfo.textContent = 'Выберите день';
            dayClicksList.innerHTML = '';
            confirmOverlay.classList.remove('open');
        });
        confirmNo.addEventListener('click', () => confirmOverlay.classList.remove('open'));
        confirmOverlay.addEventListener('click', function(e) {
            if (e.target === this) confirmOverlay.classList.remove('open');
        });

        calendarIcon.addEventListener('click', openCalendar);
        closeCalendar.addEventListener('click', () => calendarOverlay.classList.remove('open'));
        calendarOverlay.addEventListener('click', function(e) {
            if (e.target === this) calendarOverlay.classList.remove('open');
        });
        prevMonthBtn.addEventListener('click', () => changeMonth(-1));
        nextMonthBtn.addEventListener('click', () => changeMonth(1));

        // ============================================================
        // СМЕНА ЧАСОВОГО ПОЯСА
        // ============================================================
        function checkTimezoneChange() {
            const currentTz = getTzOffsetMinutes();
            if (currentTz !== savedTzOffset) {
                const diffMinutes = currentTz - savedTzOffset;
                const diffH = diffMinutes / 60;
                const diffStr = diffH > 0 ? `+${diffH}` : `${diffH}`;
                document.getElementById('tz-message').textContent =
                    `Похоже, у вас изменился часовой пояс (сдвиг ${diffStr} ч). Пересчитать все прошлые обнимашки с новым сдвигом?`;
                tzOverlay.classList.add('open');
            }
        }

        tzYes.addEventListener('click', function() {
            const currentTz = getTzOffsetMinutes();
            const diffMs = (currentTz - savedTzOffset) * 60 * 1000;
            for (const date in history) {
                history[date] = history[date].map(c => ({
                    t: c.t + diffMs,
                    h: currentTz,
                    approx: c.approx
                }));
            }
            savedTzOffset = currentTz;
            persistData();
            if (calendarOverlay.classList.contains('open')) renderCalendar(currentYear, currentMonth);
            tzOverlay.classList.remove('open');
        });

        tzNo.addEventListener('click', function() {
            savedTzOffset = getTzOffsetMinutes();
            persistData();
            tzOverlay.classList.remove('open');
        });

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            await loadData();
            applyAllSettings();

            // После миграции — сохраняем в новом формате
            persistData();

            const today = new Date();
            selectedDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

            setTimeout(checkTimezoneChange, 800);
        }

        init();
    })();
</script>
</body>
</html>
